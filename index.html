<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Запас хода — гид по зарядке и разъёмам электромобилей</title>
<style>
:root{
  --bg:#0E1621; --panel:#17212B; --panel2:#1E2A37; --line:#26313D;
  --text:#F2F5F8; --muted:#8B98A5; --accent:#3390EC; --accent-soft:rgba(51,144,236,.14);
  --green:#2DB67D; --amber:#E6B45B; --red:#E15B64; --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:#0A0F16; font-family:-apple-system,'SF Pro Text',Roboto,'Segoe UI',Arial,sans-serif; color:var(--text)}
body{display:flex; justify-content:center; align-items:flex-start; min-height:100vh}
#frame{position:relative; width:100%; max-width:430px; height:100dvh; max-height:920px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden}
@media(min-width:480px){#frame{margin:12px 0; border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,.55); border:1px solid #1B2733}}
header{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:5}
.hback{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
.htitle{flex:1;min-width:0}
.t1{font-weight:700;font-size:15.5px;text-transform:uppercase;letter-spacing:.3px}
.t2{font-size:12px;color:var(--muted)}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;flex:0 0 auto}
main{flex:1; overflow-y:auto; padding:14px 14px 30px; scroll-behavior:smooth}
.view{display:none; animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{margin:4px 0 14px}
.hero .h1{font-size:19px;font-weight:800;line-height:1.3;text-transform:uppercase;letter-spacing:.3px}
.hero .h2{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.field{margin-bottom:10px}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font-size:14.5px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--accent)}
.lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:14px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;cursor:pointer;user-select:none;transition:.15s}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#fff;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.m-card{cursor:pointer;transition:.15s}
.m-card:active{transform:scale(.985)}
.m-name{font-weight:700;font-size:14.5px}
.m-meta{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.ok{background:rgba(45,182,125,.16);color:var(--green)}
.tag.check{background:rgba(230,180,91,.16);color:var(--amber)}
.port-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.port-row:last-child{border-bottom:none}
.port-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;background:var(--panel2);border:1px solid var(--line)}
.port-lbl{font-size:11.5px;color:var(--muted)}
.port-val{font-weight:700;font-size:14.5px;margin-top:2px}
.port-hint{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.big-name{font-weight:800;font-size:19px;line-height:1.3}
.note{border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.5;margin:10px 0}
.note.amber{background:rgba(230,180,91,.09);border:1px solid rgba(230,180,91,.22)}
.note.green{background:rgba(45,182,125,.09);border:1px solid rgba(45,182,125,.22)}
.note.blue{background:var(--accent-soft);border:1px solid rgba(51,144,236,.3)}
.sol-item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.sol-item:last-child{border-bottom:none}
.sol-badge{flex:0 0 auto;font-size:10px;font-weight:800;padding:4px 8px;border-radius:8px;margin-top:1px}
.sol-badge.need{background:rgba(45,182,125,.16);color:var(--green)}
.sol-badge.opt{background:var(--accent-soft);color:var(--accent)}
.sol-badge.no{background:rgba(139,152,165,.12);color:var(--muted)}
.sol-name{font-weight:700;font-size:13.5px}
.sol-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px}
.gl-name{font-weight:800;font-size:15px}
.gl-sub{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:2px}
.gl-desc{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.pain-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.pain-card:last-child{margin-bottom:0}
.pain-t{font-weight:700;font-size:12.5px;line-height:1.4}
.pain-s{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.pain-src{font-size:11px;color:var(--accent);cursor:pointer;margin-top:7px;display:inline-block}
.pain-more{display:block;text-align:center;font-size:12.5px;font-weight:700;color:var(--accent);cursor:pointer;padding:8px 0 2px}
.pn-chip{display:inline-block;font-size:11.5px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer}
.pn-chip:active{background:var(--accent-soft)}
.pn-chip.pn-more{cursor:default;background:transparent;border-color:transparent;color:var(--muted);padding:5px 2px}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mod-tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:pointer}
.mod-tile:active{background:var(--accent-soft)}
.mod-b{font-size:10.5px;color:var(--accent);font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.mod-t{font-weight:700;font-size:14px;line-height:1.3;margin-top:3px}
.mod-y{font-size:10.5px;color:var(--muted);margin-top:4px}
.top-b{font-size:13px;font-weight:800;padding:7px 12px}
.demo-banner{
.onb-m{padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px;font-weight:600;cursor:pointer}
.onb-m:active{background:var(--accent-soft)}
.pn-chip.pn-on{background:var(--accent);color:#fff;border-color:var(--accent)}
.b-light{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer}
.b-light:active{opacity:.8}
.demo-banner{font-size:11px;color:var(--amber);background:rgba(230,180,91,.09);border:1px solid rgba(230,180,91,.25);border-radius:10px;padding:6px 10px;margin-bottom:12px;text-align:center}
.sol-link{display:inline-block;margin:0 6px 6px 0;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(51,144,236,.3);border-radius:9px;padding:5px 10px;cursor:pointer}
.prod-detail{padding:10px 0 6px 52px;border-top:1px dashed var(--line);margin-top:2px}
.pd-mini{display:flex;gap:12px}
.pd-mini img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--line);flex:0 0 auto}
.mini-emoji{width:72px;height:72px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}
.buy-mini{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}

</style>
</head>

<div id="frame">
  <header>
    <button class="hback" id="backBtn" onclick="goBack()" hidden>‹</button>

      <div class="t1">🔋 Запас хода</div>

<script>
var PAIN={"AITO-01":{"t":"AITO M7: V2L есть, но V2H/V2G в РФ не заявлены; SoC 20-80% на ежедневке; зимой предпрогрев перед DC","s":"Рекомендации BMS; проверка HV-соединений раз в 30 тыс км; ОЖ батареи менять 80-100 тыс км","u":"https://kitajcar.ru/aito-huawei/aito-m7-2/battery/","d":"kitajcar.ru"},"AV-01":{"t":"Avatr: сбои ESP «не готова» на ходу, ограничение мощности, ошибки HV; иногда не заряжается на старых DC","s":"Перезагрузка системы; обновление ПО; проверка зарядки на DC перед покупкой; обращаться письменно (технически сложный товар — 15 дней)","u":"https://saenko-group.ru/press-center/articles/defekty-avatr-12/","d":"saenko-group.ru"},"AV-02":{"t":"Avatr: к 50-70 тыс км течь трубок теплообменника батареи; антифриз специфический","s":"Осмотр днища на подтёки; заменять только специнфризом; предпрогрев активировать в мороз","u":"https://cars-problem.ru/brand/avatr/11/11-2022","d":"cars-problem.ru"},"BAT-01":{"t":"Деградация батареи от частых быстрых зарядок (CHAdeMO 50 кВт без охлаждения — особенно Leaf: -10..15% за 50 циклов)","s":"Быстрая зарядка не чаще 1 раза в неделю; заряжать до 80%; Leaf Spy Pro для контроля SOH; парковка в тени летом; хранить при 30-50%","u":"https://nissan-expert.vercel.app/articles/n/ni/nissan-lif-emkost-batarei.html","d":"nissan-expert.vercel.app"},"BAT-02":{"t":"Глубокий разряд до 0% и хранение на 100% ускоряют деградацию","s":"Рабочий диапазон 20-80%, хранение 40-60%; полный цикл 5-10%→100% 2-3 раза для калибровки (Voyah)","u":"https://dzen.ru/a/aOzsu1Nb5W3J9wl8","d":"dzen.ru"},"BAT-03":{"t":"LFP-батареи теряют до 30-40% при -20°C — норма химии, не брак (BYD Blade)","s":"7 способов сократить потери до 25%: предпрогрев, локальный обогрев, шины, стиль вождения; зимой не ниже 5% заряда","u":"https://www.drive2.ru/b/738275329881160680/","d":"drive2.ru"},"BAT-04":{"t":"12В АКБ садится (12V battery drain): после обновлений ПО, при простое, ключ рядом с авто — каскад ошибок, машина «не оживает»","s":"Мультиметр раз в месяц, клеммы/масса чистить; убирать ключ на >15 м от авто; при долгом простое отключать массу; для Kia EV6/Ioniq5 — замена ICCU по гарантии; у Evolute — замена бракованных АКБ","u":"https://dzen.ru/a/aMpA-1RwWGlX1s-U","d":"dzen.ru"},"BAT-05":{"t":"Замена батареи: дорогая (VW ID.4 >1 млн ₽; Leaf 40кВтч ~800 тыс.), но для Leaf есть рынок б/у и перепаковка","s":"Leaf: перепаковка на CATL, кан-мост, 100 тыс км на такси-тестах; проверять SOH через Leaf Spy; остальные — смотреть SOH перед покупкой (деградация >10% = торг)","u":"https://www.drom.ru/info/misc/nissan-leaf-92876.html","d":"drom.ru"},"BYD-01":{"t":"BYD: русификация/мастер-аккаунт, LFP -40% зимой, зарядки на трассах дефицит","s":"Клубы владельцев (BYD Song+ Club и др.); предпрогрев; маршрут через PlugShare; расширенная гарантия импортёра 100-200 тыс ₽","u":"https://www.drive2.ru/b/738275329881160680/","d":"drive2.ru"},"BYD-02":{"t":"BYD: шаровая опора стучит на 6+ тыс км (Song L и др.), масло в редукторе менять на 4-5 тыс км (стружка)","s":"Замена/восстановление шаровой; замена масла в редукторе до 5 тыс км и каждые 20 тыс км; лак ЛКП облезает — оклейка плёнкой (3 тыс ₽)","u":"https://abw.by/news/experience/2025/09/11/zaryadka-krysha-slabye-mesta-i-gluki-chto-stoit-znat-pered-pokupkoi-elektromobilya-narodnoi-marki-byd","d":"abw.by"},"BYD-03":{"t":"BYD: станция-комплект требует программирования ключ-карты (держать карту 30 сек после сигнала), без заземления не работает","s":"Программирование карты по инструкции; ставить заземление; красная кнопка перезапуска на станции","u":"https://abw.by/news/experience/2025/09/11/zaryadka-krysha-slabye-mesta-i-gluki-chto-stoit-znat-pered-pokupkoi-elektromobilya-narodnoi-marki-byd","d":"abw.by"},"BYD-04":{"t":"BYD: переходник CHAdeMO→GB/T на BYD не работает (особенность электрики); Xtronik ~70 тыс ₽","s":"Только DC-адаптер CCS2→GB/T; проверять на конкретной станции перед покупкой","u":"https://www.drom.ru/info/test-drive/byd-song-plus-gb-t-99183.html","d":"drom.ru"},"DE-01":{"t":"Deepal S07: реальный электропробег 150-160 км вместо 196; OBC ~4,5 кВт даже от 3ф; генератор включается сам при <15%","s":"Ночной заряд; режим «только электричество» с пониманием ограничений; приём на 20А домашней сети","u":"https://www.ixbt.com/car/deepal-s07-review.html","d":"ixbt.com"},"DE-02":{"t":"Deepal: глухие клиенты про заземление — зарядное не работает без заземления; программные глюки, замерзающие уплотнители","s":"Правильный монтаж с заземлением; предпрогрев по таймеру 10-15 мин; сброс настроек при раскачке (галочка «убрать раскачку»)","u":"https://deepal-club.ru/threads/%D0%9E%D1%82%D0%B7%D1%8B%D0%B2%D1%8B-%D0%B2%D0%BB%D0%B0%D0%B4%D0%B5%D0%BB%D1%8C%D1%86%D0%B5%D0%B2-%D0%BF%D0%BB%D1%8E%D1%81%D1%8B-%D0%B8-%D0%BC%D0%B8%D0%BD%D1%83%D1%81%D1%8B-deepal-g318.171/page-2","d":"deepal-club.ru"},"EU-01":{"t":"VW ID.4: сенсорные дверные ручки глючат на морозе; «чёрный экран» мультимедиа (100 тыс ₽ перепрошивка); Android не подключается","s":"Предпрогрев; обновление с флешки; CarPlay работает; Яндекс Навигатор вместо встроенной навигации","u":"https://www.e1.ru/text/auto/2024/02/06/73195712/","d":"e1.ru"},"EU-02":{"t":"EU EV (ID.4, Q4 e-tron, Enyaq, iX): 20-дюймовые шины с разной шириной осей — подбор вручную; ночной тариф решает экономику","s":"Планировать шины заранее; программировать ночную зарядку (экономия в разы)","u":"https://www.e1.ru/text/auto/2024/02/06/73195712/","d":"e1.ru"},"EVOL-01":{"t":"Evolute i-PRO: слабая печка, контур отопления ломается (клапан), брак 12В АКБ (резко садится в ноль), дилеры закрываются","s":"Установка автономного отопителя (60 тыс ₽ у дилера, «Бинар»); замена АКБ; следить за закрытием дилеров — вести переписку письменно","u":"https://dzen.ru/a/ZdZSvOP6TXCbCoKh","d":"dzen.ru"},"EVOL-02":{"t":"Evolute: без подогрева батареи (спорно; есть охлаждение по словам сервиса) зимой заряд/разряд проблемный; такси-эксплуатация тяжёлая","s":"Дизельная печка (вебасто-аналог); гараж; зная телематику — подогрев из приложения","u":"https://vk.ru/wall-93979119_78451","d":"vk.ru"},"EVOL-03":{"t":"Moskvich 3e: штатное ЗУ 2,3 кВт; таймера нет — прогревочную подзарядку делать через умную розетку; лючок обмерзает","s":"Умная розетка/таймер на станции; прогревочная подзарядка 30-40 мин перед выездом; режим «короткие поездки» — просят у инженеров","u":"https://ev-start.ru/reviews/vygonyaem-elektricheskiy-moskvich-na-moroz/","d":"ev-start.ru"},"EX-01":{"t":"Exlantix ET: спрос «какая зарядка/разъём» 1005 запр./30д — новички не понимают разъём; VW/Audi под капотом (EXlantix uses GB/T? check)","s":"Подбор по модели в мини-апп; проверять по VIN/фото лючка (EU Type2/CCS2 vs GB/T)","u":"https://wordstat.yandex.ru/#!/words?query=зарядка+для+exlantix","d":"wordstat.yandex.ru"},"GB-01":{"t":"Приехал на ЭЗС — нечем зарядиться: у китайских EV оба порта GB/T (AC и DC), на станции с Type2/CCS2 без переходника не зарядиться","s":"Возить адаптер Type2→GB/T AC (на AC) и на DC искать станции с пистолетом GB/T; на CCS2-трассе — DC-адаптер CCS2→GB/T. Уточнять, у станции «столбик» без кабеля или с кабелем","u":"https://abw.by/news/partnership/2025/06/04/kak-zaryazhat-kitaiskie-elektromobili-i-kakie-zaryadnye-stancii-byvaut-obyasnyaet-greenlightby","d":"abw.by"},"GB-02":{"t":"Ожидание «22 кВт на станции — получу 22 кВт» не оправдывается: 95% китайских EV с однофазным OBC ~7 кВт; трёхфазная станция даёт лишь треть","s":"Перед покупкой станции проверять фазность OBC своей модели (см. лист «Модели»); не покупать трёхфазную станцию для однофазной машины","u":"https://abw.by/news/partnership/2025/06/04/kak-zaryazhat-kitaiskie-elektromobili-i-kakie-zaryadnye-stancii-byvaut-obyasnyaet-greenlightby","d":"abw.by"},"GB-03":{"t":"Дорога в Европу без переходников невозможна — там всё CCS2/Type2","s":"Полный комплект: Type2→GB/T AC + DC-адаптер CCS2→GB/T; перед дальнобоем проверять работу адаптера на конкретных сетях","u":"https://abw.by/news/partnership/2025/06/04/kak-zaryazhat-kitaiskie-elektromobili-i-kakie-zaryadnye-stancii-byvaut-obyasnyaet-greenlightby","d":"ab .p-price{font-weight:800;font-size:14.5px;margin-top:4px}
.p-btns{display:flex;gap:7px;margin-top:8px}
.b-add{flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.b-add:active{opacity:.85}
.b-info{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.pdet{display:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.5}
.ci-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.ci-emo{font-size:24px;flex:0 0 40px;text-align:center}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:600}
.ci-price{font-size:12px;color:var(--muted);margin-top:2px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:15px;cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:700;font-size:13.5px}
.total-box{background:linear-gradient(135deg,var(--panel) , var(--panel2));border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}
.total-row{display:flex;justify-content:space-between;font-size:13.5px;margin:3px 0}
.total-big{font-size:18px;font-weight:800}
.form .field{margin-bottom:9px}
.form select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font-size:14px;font-family:inherit;appearance:none}
.ok-box{background:rgba(45,182,125,.12);border:1px solid var(--green);border-radius:14px;padding:16px;text-align:center;font-size:13.5px;line-height:1.5}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg-btn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 6px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.seg-btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.note-amber{background:rgba(230,180,91,.12);border:1px solid var(--amber);border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
.cta-ch{display:flex;gap:8px;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;width:100%}
.cta-ch:active{background:var(--accent-soft)}
.sol-add{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:9px;padding:5px 10px;cursor:pointer;user-select:none}
.sol-add:active{opacity:.8}
.tb-badge.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.4)}100%{transform:scale(1)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#1E2A37;border:1px solid var(--green);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;animation:fade .18s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer}left:50%;transform:translateX(-50%);bottom:76px;background:#1E2A37;border:1px solid var(--green);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;animation:fade .18s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style>
<script>
/* ================= КОРЗИНА + КАТАЛОГ (сшивка) ================= */
const ENABLE_RETAIL=false; // true — вернуть прямую продажу (сегмент в чекауте)
const CART_KEY='ev_cart_v1';
function evTrack(ev,val){
  try{const log=JSON.parse(localStorage.getItem('ev_events')||'[]');
  log.push({e:ev,v:val===undefined?null:val,t:Date.now()});
  localStorage.setItem('ev_events',JSON.stringify(log.slice(-100)));
  }catch(e){}
}
const CHANNEL_URL='https://t.me/zapashoda_ev'; // TODO: заменить на реальный канал
let cart=[];
try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch(e){cart=[]}
function saveCart(){try{localStorage.setItem(CART_KEY,JSON.stringify(cart))}catch(e){}updateBadge()}
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0)}
function updateBadge(){const b=document.getElementById('cartBadge');const n=cartCount();if(b){b.textContent=n;b.hidden=n===0;
  if(n>0){b.classList.remove('bump');void b.classList;setTimeout(()=>b.classList.add('bump'),10);}}}
function prod(id){return PRODUCTS.find(p=>p.id===id)}
function pidFromBtn(btn){const det=btn.closest('[id^="det"]');if(!det)return null;const key=det.id.slice(3);const id=parseInt(key.split('_')[1],10);return isNaN(id)?null:id;}
function toast(msg,goCart){const t=document.createElement('div');t.className='toast';t.textContent=msg;if(goCart)t.onclick=()=>tabGo('cart');document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function addToCart(id,btn){const ex=cart.find(i=>i.id===id);if(ex)ex.qty+=1;else{const p=prod(id);cart.push({id,name:p.name,price:p.price,emo:p.emoji||'🔌',qty:1})}saveCart();evTrack('add_cart',id);toast('Добавлено в заявку 📝 · открыть',true);
if(btn){const old=btn.textContent;btn.textContent='✓ Добавлено';btn.disabled=true;setTimeout(()=>{btn.textContent=old;btn.disabled=false},1100);}}
function setQty(id,d){const it=cart.find(i=>i.id===id);if(!it)return;it.qty+=d;if(it.qty<=0)cart=cart.filter(i=>i.id!==id);saveCart();renderCart();if(!cart.length)tabGo('home');}
function removeItem(id){cart=cart.filter(i=>i.id!==id);saveCart();renderCart();}
function cartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}

/* buyMini: кнопка «В заявку» — добавляет в корзину */
function buyMini(btn){
  const id=pidFromBtn(btn);
  if(id){addToCart(id);
    const old=btn.textContent;btn.textContent='✓ Добавлено';btn.disabled=true;
    setTimeout(()=>{btn.textContent=old;btn.disabled=false},1100);
  }
}

/* ---------- Каталог ---------- */
let catFilter='all';
function renderCat(){
  const cats=['all',...new Set(PRODUCTS.map(p=>p.cat))];
  const chips=cats.map(c=>`<div class="chip ${c===catFilter?'on':''}" onclick="catSet('${c}')">${c==='all'?'Всё':c}</div>`).join('');
  const list=PRODUCTS.filter(p=>catFilter==='all'||p.cat===catFilter);
  const teaser=`<div class="card" onclick="openChannel();evTrack('teaser_click')" style="cursor:pointer">
    <div class="gl-name">🔧 Запчасти и сервисы — скоро</div>
    <div class="gl-desc">Планируем: подбор запчастей и проверенных сервисов в вашем городе. Подпишитесь — сообщим первыми.</div></div>`;
  document.getElementById('v-cat').innerHTML=`
    <div class="hero"><div class="h1">Каталог</div><div class="h2">Аксессуары для зарядки EV: адаптеры, кабели, зарядки. Подберите по своей модели на вкладке «Моя EV».</div></div>
    <div class="cat-chips">${chips}</div>
    ${list.map(p=>{
      return `<div class="p-card">
        <div class="p-img"><span class="p-emo">${p.emoji||'🔌'}</span></div>
        <div style="flex:1;min-width:0">
          <div class="p-name">${p.name}</div>
          <div class="p-cat">${p.cat} · ${p.fits?p.fits.join(', '):''}</div>
          <div class="p-price">${fmtP(p.price)}</div>
          <div class="p-btns">
            <button class="b-add" onclick="addToCart(${p.id},this)">В заявку</button>
            <button class="b-info" onclick="toggleDet('c_${p.id}',event)">Подробнее</button>
          </div>
          <div class="pdet" id="detc_${p.id}"></div>
        </div>
      </div>`}).join('')}
    ${teaser}`;
}
function catSet(c){catFilter=c;renderCat();}

/* ---------- Корзина ---------- */
function renderCart(){
  const el=document.getElementById('v-cart');
  const mR=ENABLE_RETAIL&&orderMode==='retail', mD=!ENABLE_RETAIL||orderMode==='dealer';
  if(!cart.length){
    el.innerHTML=`<div class="hero"><div class="h1">Заявка пуста</div><div class="h2">Выберите аксессуары — заявка уйдёт ближайшему салону-партнёру.</div></div>
      <button class="b-add" style="width:100%;padding:13px" onclick="tabGo('home')">🔍 Подобрать по модели</button>
      <button class="cta-ch" style="margin-top:9px" onclick="openChannel()">📱 Подписаться на «Запас хода»</button>`;
    return;
  }
  const rows=cart.map(i=>`
    <div class="ci-row">
      <div class="ci-emo">${i.emo}</div>
      <div class="ci-info"><div class="ci-name">${i.name}</div><div class="ci-price">${fmtP(i.price)} × ${i.qty} = ${fmtP(i.price*i.qty)}</div></div>
      <div class="qty"><button onclick="setQty(${i.id},-1)">−</button><span>${i.qty}</span><button onclick="setQty(${i.id},1)">+</button></div>
      <button class="hbtn" style="width:30px;height:30px;font-size:14px" onclick="removeItem(${i.id})">✕</button>
    </div>`).join('');
  el.innerHTML=`
    <div class="hero"><div class="h1">Заявка дилеру</div><div class="h2">Мы передадим заявку салону-партнёру в вашем городе: проверка совместимости, скидка партнёра, установка на месте.</div></div>
    ${rows}
    <div class="total-box"><div class="total-row"><span>Товаров:</span><b>${cartCount()}</b></div>
      <div class="total-row"><span>Доставка:</span><span>${mD?'договоритесь с дилером':'от 400 ₽ (СДЭК, по тарифу)'}</span></div>
      <div class="total-row total-big"><span>Итого:</span><span>${fmtP(cartTotal())}</span></div></div>
    <div class="form">
      <div class="lbl">Контакты</div>
      <div class="field"><input id="of_name" value="${F.of_name||''}" oninput="fSave('of_name',this.value)" placeholder="Имя"></div>
      <div class="field"><input id="of_phone" value="${F.of_phone||''}" oninput="fSave('of_phone',this.value)" inputmode="tel" placeholder="Телефон / Telegram"></div>
      <div class="field"><input id="of_city" value="${F.of_city||''}" oninput="fSave('of_city',this.value)" placeholder="Город${mD?' — подберём ближайший салон':''}"></div>
      <div id="dlv_block"${mD?' hidden':''}><div class="lbl">Доставка</div>
      <div class="field"><select id="of_dlv" onchange="fSave('of_dlv',this.value)"><option>СДЭК — пункт выдачи</option><option>СДЭК — курьер до двери</option><option>Boxberry</option><option>Уточню у менеджера</option></select></div></div>
      <div class="field"><input id="of_cmt" value="${F.of_cmt||''}" oninput="fSave('of_cmt',this.value)" placeholder="Комментарий (необязательно)"></div>
      ${ENABLE_RETAIL?`<div class="lbl">Как оформить</div>
      <div class="seg">
        <button id="m_ret" class="seg-btn ${mR?'on':''}" onclick="setMode('retail')">🛒 Напрямую — доставка мне</button>
        <button id="m_dlr" class="seg-btn ${mD?'on':''}" onclick="setMode('dealer')">🏢 Через дилера</button>
      </div>`:''}
      <div id="dlr_note" class="note-amber"${mD?'':' hidden'}>Менеджер салона-партнёра проверит совместимость, назовёт цену с партнёрской скидкой и подберёт удобное время установки.</div>
      <button id="submit_btn" class="b-add" style="width:100%;padding:14px;font-size:14.5px" onclick="submitOrder()">${mD?'Отправить заявку дилеру':'Оформить заказ'} · ${fmtP(cartTotal())}</button>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">Оплата — дилеру в салоне при получении.</div>
    </div>`;
}
var orderMode='retail';
var F={of_name:'',of_phone:'',of_city:'',of_dlv:'',of_cmt:''};
function fSave(k,v){F[k]=v;}
function setMode(m){
  orderMode=m;
  document.getElementById('m_ret').classList.toggle('on',m==='retail');
  document.getElementById('m_dlr').classList.toggle('on',m==='dealer');
  document.getElementById('dlr_note').hidden=(m!=='dealer');
  document.getElementById('dlv_block').hidden=(m==='dealer');
  evTrack('mode_'+m);
  document.getElementById('submit_btn').textContent=(m==='dealer')?('Оставить заявку дилеру · '+fmtP(cartTotal())):('Оформить заказ · '+fmtP(cartTotal()));
}
function openChannel(){
  const tg=window.Telegram&&Telegram.WebApp;
  if(tg&&tg.openTelegramLink){tg.openTelegramLink(CHANNEL_URL);}
  else if(typeof window.open==='function'){window.open(CHANNEL_URL,'_blank');}
  else{toast('Канал: '+CHANNEL_URL);}
}
function buildSummary(p){
  const L=[];
  L.push(p.t==='ev_dealer_lead'?'🆕 Заявка дилеру':'🆕 Заказ');
  if(p.name)L.push('👤 '+p.name);
  L.push('📞 '+p.phone);
  if(p.city)L.push('📍 '+p.city);
  if(p.model)L.push('🚗 '+p.model);
  (p.items||[]).forEach(i=>L.push('• '+i.name+' ×'+i.qty+' — '+fmtP(i.price*i.qty)));
  L.push('💰 Итого: '+fmtP(p.total||0));
  if(p.comment)L.push('💬 '+p.comment);
  return L.join('\n');
}
var GAS_URL='https://script.google.com/macros/s/AKfycbzN7vprIvJEp2qr_nwr9N1wzHVrmhu_ZDskK8TNLco_qwIh8mfYvSPBLrS7MqJvtgfY3Q/exec';
function submitOrder(){
  const name=(document.getElementById('of_name')||{}).value||'';
  const phone=(document.getElementById('of_phone')||{}).value||'';
  const city=((document.getElementById('of_city')||{value:''}).value||'').trim();
  const isDealer=ENABLE_RETAIL?(orderMode==='dealer'):true;
  if(!phone.trim()){toast('Укажите телефон или Telegram');return;}
  if(isDealer&&!city){toast('Укажите город — подберём ближайший салон');return;}
  const payload={
    t:isDealer?'ev_dealer_lead':'ev_order', date:new Date().toISOString(),
    items:cart.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty})),
    total:cartTotal(),
    name:name.trim(), phone:phone.trim(),
    city:city,
    delivery:isDealer?null:(document.getElementById('of_dlv')||{value:''}).value,
    comment:(F.of_cmt||'').slice(0,200),
    model: (typeof MY==='number'&&MY>=0) ? MODELS[MY].slice(0,2).join(' ') : null
  };
  let json=JSON.stringify(payload);
  if(json.length>3900){payload.comment='';json=JSON.stringify(payload);}
  const summary=buildSummary(payload);
  evTrack(payload.t==='ev_dealer_lead'?'submit_dealer_lead':'submit_retail');
  const tg=window.Telegram&&Telegram.WebApp;
  let sentTg=false;
  if(tg&&tg.sendData){try{tg.sendData(summary);sentTg=true;}catch(e){}}
  if(GAS_URL){try{fetch(GAS_URL,{method:'POST',body:json}).catch(()=>{});}catch(e){}}
  const itemsHtml=(payload.items||[]).map(i=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${i.name}${i.qty>1?' ×'+i.qty:''}</span><b style="white-space:nowrap">${fmtP(i.price*i.qty)}</b></div>`).join('');
  const copyNote=sentTg?'<div class="note" style="margin:10px 0 0">📄 Копия заявки уже у тебя в чате с ботом.</div>':'';
  const head=(sentTg||GAS_URL)?'✅ Заявка отправлена':'📋 Заявка готова';
  const sub=sentTg?(isDealer?'Салон-партнёр свяжется с вами.':'Мы свяжемся с вами.')
    :(GAS_URL?'Обрабатываем — ответ придёт в Telegram.':'Откройте апп через бота в Telegram — и заявка уйдёт туда.');
  document.getElementById('v-cart').innerHTML=`
    <div class="ok-box"><div style="font-size:34px;margin-bottom:8px">${(sentTg||GAS_URL)?'✅':'📋'}</div>
    <b>${head}</b><br><span style="font-size:12.5px;color:var(--muted)">${sub}</span>
    <div style="margin:12px 0 4px;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left;font-size:13px">
      ${itemsHtml||'<div style="color:var(--muted)">Без позиций</div>'}
      <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between"><span>Итого</span><b>${fmtP(cartTotal())}</b></div>
    </div>
    <div style="font-size:11.5px;color:var(--muted);line-height:1.5">Оплата — дилеру в салоне при получении.</div>
    ${copyNote}
    <button class="cta-ch" style="margin:12px auto 0;max-width:320px" onclick="openChannel()">📱 Канал «Запас хода» — гайды по зарядке EV</button>
    <button class="b-add" style="width:auto;padding:10px 18px;margin:9px auto 0;display:block" onclick="cart=[];saveCart();renderCart();tabGo('home')">Понятно</button></div>`;
}

/* ---------- Таб-бар и навигация ---------- */
const TAB_OF={home:'home',model:'home',gloss:'gloss',cat:'cat',cart:'cart'};
function tabGo(v){
  if(v==='cat'){renderCat();evTrack('open_cat');}
  if(v==='cart')evTrack('open_cart');
  if(v==='cart')renderCart();
  showView(v);
}
const _sv=showView;
showView=function(v){
  _sv(v);
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===(TAB_OF[v]||'home')));
};
function goBack(){ if(state.view==='model'||state.view==='gloss'||state.view==='cat'||state.view==='cart') showView('home'); }

/* init Telegram */
if(window.Telegram&&Telegram.WebApp){try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}}
renderCat();renderCart();updateBadge();
</script>

</body>
</html>

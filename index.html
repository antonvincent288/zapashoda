<title>Запас хода — гид по зарядке и разъёмам электромобилей</title>
<style>
:root{
  --bg:#0E1621; --panel:#17212B; --panel2:#1E2A37; --line:#26313D;
  --text:#F4F7FA; --muted:#A7B4C2; --accent:#4CA1F0; --accent-soft:rgba(76,161,240,.16);
  --green:#2DB67D; --amber:#E6B45B; --red:#E15B64; --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:#0A0F16; font-family:-apple-system,'SF Pro Text',Roboto,'Segoe UI',Arial,sans-serif; color:var(--text); font-size:16px; -webkit-text-size-adjust:100%}
body{display:flex; justify-content:center; align-items:flex-start; min-height:100vh}
#frame{position:relative; width:100%; max-width:430px; height:100dvh; max-height:920px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden}
@media(min-width:480px){#frame{margin:12px 0; border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,.55); border:1px solid #1B2733}}
header{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:5}
.hback{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;flex:0 0 auto}
.htitle{flex:1;min-width:0}
.t1{font-weight:800;font-size:17px;letter-spacing:-.01em}
.t2{font-size:13.5px;color:var(--muted)}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
main{flex:1; overflow-y:auto; padding:14px 14px 30px; scroll-behavior:smooth}
.view{display:none; animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{margin:4px 0 14px}
.hero .h1{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.02em}
.hero .h2{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.5}
.field{margin-bottom:10px}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;font-size:16px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--accent)}
.lbl{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;cursor:pointer;user-select:none;transition:.15s}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#fff;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.m-card{cursor:pointer;transition:.15s}
.m-card:active{transform:scale(.985)}
.m-name{font-weight:700;font-size:16px}
.m-meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
.tagX{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.ok{background:rgba(45,182,125,.16);color:var(--green)}
.tag.check{background:rgba(230,180,91,.16);color:var(--amber)}
.port-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.port-row:last-child{border-bottom:none}
.port-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;background:var(--panel2);border:1px solid var(--line)}
.port-lbl{font-size:13px;color:var(--muted)}
.port-val{font-weight:700;font-size:15.5px;margin-top:2px}
.port-hint{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.big-name{font-weight:800;font-size:21px;line-height:1.25;letter-spacing:-.02em}
.note{border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.55;margin:12px 0}
.note.amber{background:rgba(230,180,91,.09);border:1px solid rgba(230,180,91,.22)}
.note.green{background:rgba(45,182,125,.09);border:1px solid rgba(45,182,125,.22)}
.note.blue{background:var(--accent-soft);border:1px solid rgba(51,144,236,.3)}
.sol-item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.sol-item:last-child{border-bottom:none}
.sol-badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;margin-top:1px}
.sol-badge.need{background:rgba(45,182,125,.16);color:var(--green)}
.sol-badge.opt{background:var(--accent-soft);color:var(--accent)}
.sol-badge.no{background:rgba(139,152,165,.12);color:var(--muted)}
.sol-name{font-weight:700;font-size:13.5px}
.sol-desc{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.55}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px}
.gl-name{font-weight:800;font-size:16.5px}
.gl-sub{font-size:13px;color:var(--accent);font-weight:600;margin-top:2px}
.gl-desc{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.55}
.pain-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--panel2)}
.pain-card:last-child{margin-bottom:0}
.pain-t{font-weight:700;font-size:15px;line-height:1.35}
.pain-s{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.55}
.pain-src{font-size:13px;color:var(--accent);cursor:pointer;margin-top:9px;display:inline-block}
.pain-more{display:block;text-align:center;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;padding:10px 0 4px}
.pn-chip{display:inline-block;font-size:13px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer}
.pn-chip:active{background:var(--accent-soft)}
.pn-chip.pn-more{cursor:default;background:transparent;border-color:transparent;color:var(--muted);padding:5px 2px}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mod-tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:pointer}
.mod-tile:active{background:var(--accent-soft)}
.mod-b{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.mod-t{font-weight:700;font-size:15.5px;line-height:1.3;margin-top:4px}
.mod-y{font-size:12.5px;color:var(--muted);margin-top:4px}
.top-b{font-size:13px;font-weight:800;padding:7px 12px}
.demo-banner{
.onb-m{padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px;font-weight:600;cursor:pointer}
.onb-m:active{background:var(--accent-soft)}
.pn-chip.pn-on{background:var(--accent);color:#fff;border-color:var(--accent)}
.b-light{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;padding:13px}
.b-light:active{opacity:.8}
.demo-banner{font-size:12.5px;color:var(--amber);background:rgba(230,180,91,.09);border:1px solid rgba(230,180,91,.25);border-radius:10px;padding:8px 12px;margin-bottom:12px;text-align:center}
.sol-link{display:inline-block;margin:0 6px 6px 0;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(51,144,236,.3);border-radius:9px;padding:5px 10px;cursor:pointer}
.prod-detail{padding:10px 0 6px 52px;border-top:1px dashed var(--line);margin-top:2px}
.pd-mini{display:flex;gap:12px}
.pd-mini img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--line);flex:0 0 auto}
.mini-emoji{width:72px;height:72px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}
.buy-mini{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}

</style>
</head>

<script>
var PAIN={"GB-01":{"t":"Китайский электромобиль не заряжается от российской станции: оба порта машины — GB/T","s":"У машин из Китая оба разъёма — GB/T: и медленная зарядка, и быстрая. От европейских станций Type 2 и CCS2 без переходника такая машина не зарядится. Решение: возить с собой адаптер Type 2→GB/T для AC и искать быстрые станции с пистолетом GB/T. На трассах, где только CCS2, выручает DC-адаптер CCS2→GB/T. Перед выездом уточните, выдаёт ли станция кабель или это «столбик» без кабеля.","u":"https://abw.by/news/partnership/2025/06/04/kak-zaryazhat-kitaiskie-elektromobili-i-kakie-zaryadnye-stancii-byvaut-obyasnyaet-greenlightby","d":"abw.by"},"GB-02":{"t":"Почему станция на 22 кВт заряжает китайский EV только на 7 кВт: однофазный OBC","s":"У большинства китайских электромобилей (около 95%) бортовое зарядное устройство — однофазное, примерно 7 кВт. Даже трёхфазная станция на 22 кВт даст машине только треть мощности. Перед покупкой домашней станции проверьте фазность OBC своей модели в каталоге «Модели»: под однофазную машину трёхфазная станция не нужна.","u":"https://abw.by/news/partnership/2025/06/04/kak-zaryazhat-kitaiskie-elektromobili-i-kakie-zaryadnye-stancii-byvaut-obyasnyaet-greenlightby","d":"abw.by"},"GB-03":{"t":"Поездка в Европу на китайском EV: без переходников не зарядиться — там всё CCS2 и Type 2","s":"В Европе сети работают на Type 2 и CCS2, которых на китайских машинах нет. Возите полный комплект: адаптер Type 2→GB/T для AC и DC-адаптер CCS2→GB/T для быстрой зарядки. Перед дальней поездкой проверьте адаптер на тех сетях, которыми поедете — не все станции дружат со всеми адаптерами.","u":"https://abw.by/news/partnership/2025/06/04/kak-zaryazhat-kitaiskie-elektromobili-i-kakie-zaryadnye-stancii-byvaut-obyasnyaet-greenlightby","d":"abw.by"},"GB-04":{"t":"DC-адаптер CCS2→GB/T не работает на части станций: несовместимость протоколов","s":"DC-адаптер эмулирует сигналы согласования, и часть станций его не принимает — протоколы PLC/CAN различаются. Выбирайте адаптеры последних версий с обновляемой прошивкой и подтверждённой совместимостью (проверены с зарядками ABB, Siemens, Alpitronic и других производителей). Прошивку держите актуальной, а перед покупкой просите у продавца список протестированных станций.","u":"https://www.drive2.ru/l/666984095447779018/","d":"drive2.ru"},"GB-05":{"t":"Садится батарейка в DC-адаптере CCS2→GB/T: хватает на 3–5 сессий","s":"Внутри DC-адаптера стоит батарейка 18650, которой хватает на несколько зарядных сессий. Берите версию со сменным отсеком или с авточарджем — у части адаптеров отсека для замены нет вообще. Сам адаптер можно подзарядить заранее от встроенного разъёма, но медленно.","u":"https://www.drive2.ru/l/666984095447779018/","d":"drive2.ru"},"GB-06":{"t":"Где зарядить китайский EV: быстрых станций с GB/T мало, почти вся сеть — CCS2 и Type 2","s":"Быстрых станций с разъёмом GB/T в России немного — большинство ЭЗС работают на CCS2 и Type 2. Маршрут стройте заранее в PlugShare или 2Charge с фильтром по GB/T. Альтернатива: DC-адаптер CCS2→GB/T открывает доступ ко всей CCS2-сети.","u":"https://dzen.ru/a/aOzsu1Nb5W3J9wl8","d":"dzen.ru"},"GB-07":{"t":"Зарядка китайского EV от розетки 220 В идёт медленно (2,8–3,5 кВт) — что с этим делать","s":"Любая GB/T-машина от бытовой розетки заряжается медленно: 2,8–3,5 кВт. Если заряжаетесь дома каждую ночь, поставьте настенную станцию 7 кВт — для неё нужны отдельная линия и автомат 32 А. У Li Auto и других EREV штатные схемы от 220 В работают, но тоже медленно.","u":"https://dzen.ru/a/aOzsu1Nb5W3J9wl8","d":"dzen.ru"},"GB-08":{"t":"При зарядке от удлинителя перегревается кабель и вышибает автоматы: сечение, линия, автомат","s":"Зарядка через тонкий удлинитель и на слабой проводке греет контакты и выбивает автоматы. Правильная схема: отдельная линия 3×6 мм² с автоматом 32 А под станцию. Если проводка слабая — снизьте ток зарядки в настройках машины (регулировка 8–16 А) или берите станцию с динамической балансировкой нагрузки.","u":"https://www.drive2.ru/l/679190048905627201/","d":"drive2.ru"},"UN-01":{"t":"Электромобиль медленно заряжается в мороз: холодная батарея принимает мало тока","s":"Холодная батарея принимает ток в 1,5–2 раза меньше, поэтому зимняя зарядка длится дольше. Прогрейте батарею заранее: проложите маршрут до станции в навигаторе (машина греет батарею под поездку) или запустите предпрогрев из приложения. Проще всего приезжать на зарядку с тёплой батареей после поездки. Утренние 15 минут подзарядки работают как «прогрев».","u":"https://www.drive2.ru/o/b/667947542511643213/","d":"drive2.ru"},"UN-02":{"t":"Можно ли заряжать электромобиль, если порт в льду или инее","s":"Не подключайте зарядку, пока коннектор или порт в инее — есть риск короткого замыкания. Осмотрите разъёмы на конденсат и лёд и храните резиновые заглушки порта. У Deepal S7 есть режим сушки порта — порт прогревается перед подключением.","u":"https://www.drive2.ru/o/b/667947542511643213/","d":"drive2.ru"},"UN-03":{"t":"Зарядка не стартует или прерывается: сбой согласования машины и станции","s":"Чаще всего это несовместимость прошивок машины и станции — особенно у китайских EV на старых зарядках. Отсоедините кабель, подождите минуту и переподключите. Не помогло — пробуйте соседнюю станцию. Операторы периодически обновляют прошивки. Если сбоит только одна станция, дело в ней, а не в машине.","u":"https://butikavto.by/news/tipichnye_oshibki_elektromobiley_problemy_tesla_zeekr_byd_i_geely_kotorye_mozhno_reshit_samostoyatel","d":"butikavto.by"},"UN-04":{"t":"Кабель зарядки не выходит из порта: замок не разблокировал коннектор","s":"Такое бывает на Zeekr 001/X, BYD Atto 3 и многих других EV: сессия завершена, а замок порта не отпустил кабель. Сначала разблокируйте машину и убедитесь, что зарядка полностью завершена. Если кабель застрял — используйте аварийную разблокировку: тросик или кнопку в лючке зарядного порта.","u":"https://butikavto.by/news/tipichnye_oshibki_elektromobiley_problemy_tesla_zeekr_byd_i_geely_kotorye_mozhno_reshit_samostoyatel","d":"butikavto.by"},"UN-05":{"t":"Лючок зарядки примерзает и не открывается на морозе: как открыть","s":"Прогрейте порт до выезда: у большинства машин есть предпрогрев из приложения. У Moskvich 3e лючок оттаивает после 40 минут в розетке. Если крышка всё равно не открылась, ищите аварийный тросик — например, у Li Auto L7 он за лючком.","u":"https://ev-start.ru/reviews/vygonyaem-elektricheskiy-moskvich-na-moroz/","d":"ev-start.ru"},"ZV-01":{"t":"Тугой лючок зарядки: на морозе механизм примораживает крышку","s":"Механизм лючка периодически смазывайте — на морозе крышка примораживает щель. Подходит смазка из комплекта аксессуаров (SKU 17)."},"UN-06":{"t":"Не хватает длины кабеля на парковке: какой кабель взять","s":"Если розетка или станция дальше стандартного кабеля, выручит кабель 10 м (SKU 15) или удлинитель GB/T (SKU 14). Заранее замерьте своё парковочное место, чтобы не переплачивать за лишние метры.","u":"https://www.drom.ru/info/test-drive/byd-song-plus-gb-t-99183.html","d":"drom.ru"},"ZM-01":{"t":"Запас хода зимой падает на 25–45%: почему и как вернуть километры","s":"При −20 °C батарея LFP теряет 35–45% запаса хода, NMC — 25–35%. Короткие поездки усугубляют картину: батарея не успевает прогреться. Что реально работает: предпрогрев от сети, подогрев сидений и руля вместо печки, гараж или паркинг, таймер зарядки к утру. Поездки длиннее 20 км прогревают батарею самоходом. Агрессивный стиль добавляет к расходу 25–30%, а давление в шинах на 0,3 бара выше нормы экономит ещё 3–5%.","u":"https://www.drive2.ru/b/738275329881160680/","d":"drive2.ru"},"ZM-02":{"t":"Электромобиль едет вяло на холодной батарее: поломка это или защита","s":"Это защита, а не поломка: пока батарея холодная, машина ограничивает мощность. После прогрева динамика возвращается. Запускайте предпрогрев из приложения перед выездом — и ограничение почти не почувствуете.","u":"https://butikavto.by/news/tipichnye_oshibki_elektromobiley_problemy_tesla_zeekr_byd_i_geely_kotorye_mozhno_reshit_samostoyatel","d":"butikavto.by"},"ZM-03":{"t":"Замерзают двери и уплотнители: сенсорные ручки не срабатывают на морозе","s":"Прогревайте машину по таймеру за 10–15 минут до выхода — уплотнители и ручки отойдут. У VW ID сенсорные дверные ручки на морозе глючат особенно заметно, там таймерый прогрев обязателен.","u":"https://dzen.ru/a/ao7v6f-ASUiNJj98","d":"dzen.ru"},"ZM-04":{"t":"Дверное стекло примерзает к уплотнителю: что сделать заранее","s":"Обработайте боковые стёкла антидождём или аквапелью: вода и лёд хуже прилипают, стекло реже примерзает к уплотнителю.","u":"https://www.drive2.ru/l/672159771557628270/","d":"drive2.ru"},"ZM-05":{"t":"Автопилот и круиз-контроль зимой отказывают: грязные камеры и сенсоры","s":"Зимой камеры и сенсоры в бампере забиваются грязью и реагентом, и ассистенты отключаются. Мойте зону датчиков почаще и держите в запасе ручной режим вождения.","u":"https://www.drive2.ru/l/672159771557628270/","d":"drive2.ru"},"BAT-01":{"t":"Быстрая зарядка убивает батарею Leaf: минус 10–15% ёмкости за 50 циклов","s":"У Nissan Leaf батарея без жидкостного охлаждения, и частые сессии CHAdeMO на 50 кВт заметно её изнашивают. Быструю — не чаще раза в неделю, повседневно заряжайтесь до 80%. Контролируйте SOH через Leaf Spy Pro, летом паркуйтесь в тени и храните машину при 30–50%.","u":"https://nissan-expert.vercel.app/articles/n/ni/nissan-lif-emkost-batarei.html","d":"nissan-expert.vercel.app"},"BAT-02":{"t":"Как правильно хранить батарею электромобиля: 0% и 100% ускоряют деградацию","s":"Для повседневной езды держите уровень 20–80%, на длительной стоянке — 40–60%. Полный цикл от 5–10% до 100% полезен 2–3 раза: так, например, Voyah калибрует показания батареи.","u":"https://dzen.ru/a/aOzsu1Nb5W3J9wl8","d":"dzen.ru"},"BAT-03":{"t":"LFP-батарея теряет до 40% зимой: это норма химии, а не брак (BYD Blade)","s":"При −20 °C LFP-батарея (например, BYD Blade) теряет до 30–40% запаса хода — это свойство химии, а не дефект. Потери можно сократить до 25%: предпрогрев, локальный обогрев батареи, зимние шины, спокойный стиль вождения. Зимой не опускайте заряд ниже 5%.","u":"https://www.drive2.ru/b/738275329881160680/","d":"drive2.ru"},"BAT-04":{"t":"12-вольтовый аккумулятор электромобиля садится: машина не оживает и сыпет ошибками","s":"После обновлений ПО, при долгой стоянке или когда ключ остаётся рядом с машиной, 12В АКБ разряжается — и EV «умирает» с каскадом ошибок. Раз в месяц проверяйте напряжение мультиметром и чистите клеммы. Ключ держите дальше 15 м от авто, на долгой стоянке отключайте массу. Для Kia EV6 и Ioniq 5 известен дефект ICCU — меняют по гарантии; у Evolute стояли бракованные АКБ — их меняют.","u":"https://dzen.ru/a/aMpA-1RwWGlX1s-U","d":"dzen.ru"},"BAT-05":{"t":"Сколько стоит замена батареи: Leaf 40 кВт·ч — около 800 тыс ₽, VW ID.4 — больше миллиона","s":"Официальная замена дорогая: батарея VW ID.4 стоит свыше 1 млн ₽, Leaf 40 кВт·ч — около 800 тыс ₽. Для Leaf есть рынок б/у и перепаковка на элементы CATL — владельцы проезжают по 100 тыс км на такси-тестах. Состояние батареи проверяйте через Leaf Spy (SOH); на других моделях смотрите SOH перед покупкой: деградация больше 10% — повод для торга.","u":"https://www.drom.ru/info/misc/nissan-leaf-92876.html","d":"drom.ru"},"ST-01":{"t":"Нет сервиса и запчастей для китайского EV: ждать приходится 2–4 месяца","s":"У большинства китайских брендов в РФ нет официального представительства: запчасти идут 2–4 месяца, редкие модели почти не обслуживаются. Берите машину у импортёра с собственным сервисом и общайтесь в клубах владельцев — там подскажут, где искать детали. Держите запас расходников (фильтры, колодки) и найдите профильный сервис по китайцам (например, GRAFIT).","u":"https://www.drive2.ru/b/738275329881160680/","d":"drive2.ru"},"ST-02":{"t":"Меню на китайском, навигация не работает в России: как русифицировать электромобиль","s":"Есть три пути: сервис русификации (30–80 тыс ₽), CarPlay или Android Auto там, где модель их поддерживает, либо телефон с Яндекс Навигатором вместо штатной навигации. Для BYD CarPlay/Android Auto доступны при поддержке конкретной модели.","u":"https://www.drive2.ru/b/738275329881160680/","d":"drive2.ru"},"ST-03":{"t":"Китайский EV быстро теряет в цене: минус 40–47% за три года","s":"Китайские электромобили дешевеют на 40–47% за три года, премиум-модели — хуже всех (Hongqi E-HS9: с 13 до 4 млн ₽). Считайте полную стоимость владения и не берите «серые» машины без гарантии, когда появляются официальные поставки — это било по цене Hongqi. Перед покупкой проверяйте историю: такси и каршеринг изнашивают батарею в 1,5–2 раза быстрее.","u":"https://jckauto.ru/blog/elektromobil-iz-kitaya-stoit-li-pokupat-kak-privezti","d":"jckauto.ru"},"ST-04":{"t":"Утильсбор 2026: льготный порог 80 л.с. — почти ни один EV под него не проходит","s":"С 2026 года льготная ставка утильсбора действует до 80 л.с. — под неё не попадает почти ни один электромобиль, и сбор считается по коммерческой ставке (сильнее всего бьёт по машинам из Кореи и Японии). Считайте итоговую цену «под ключ» на калькуляторе: у части моделей до 160 л.с. сбор выходит дешевле. Мощность версии проверяйте заранее.","u":"https://export-motors.com/blog/elektromobili-iz-korei","d":"export-motors.com"},"ST-05":{"t":"Отзывные кампании не доходят до РФ: ремонт Zeekr 9X стоит 580–750 тыс ₽","s":"Официального бренда в РФ нет, поэтому заводские отзывы (например, трещины редуктора Zeekr 9X) обходят наших владельцев, а ремонт стоит 580–750 тыс ₽. Перед покупкой проверяйте VIN и партию; профильные сервисы делают усиление корпуса за 30–50 тыс ₽. На случай отказа держите страховку и контакт юриста.","u":"https://dzen.ru/a/acpfGX-bk34tOTpG","d":"dzen.ru"},"PHEV-01":{"t":"Почему EREV включает бензогенератор раньше, чем батарея разрядится","s":"У EREV/REEV батарею нельзя разрядить ниже 15–16%: на этом уровне сам включается генератор — «только электричество» не абсолют (так работает Deepal S07). Планируйте 130–150 км в день с вечерней розеткой, тогда бензин не тратится. Учтите: зимой электропробег падает ещё на 20–35%.","u":"https://www.ixbt.com/car/deepal-s07-review.html","d":"ixbt.com"},"PHEV-02":{"t":"Li Auto после обновления заряжается от нештатных зарядок только 8 А: как вернуть 16 А","s":"Обновления ПО Li Auto ограничивали ток зарядки от сторонних зарядных устройств до 8 А. После версии 5.0.4 напишите в техподдержку через приложение — одобрят заявление на 16 А. В версии 5.1 и выше ток поднимается бегунком в настройках.","u":"https://www.drive2.ru/l/670092689697423025/","d":"drive2.ru"},"PHEV-03":{"t":"EREV зимой на трассе: батарея садится, генератор жжёт бензин","s":"На морозе батарея EREV разряжается быстрее, и генератор компенсирует её бензином — городская экономия на трассе заканчивается. Держите заряд генератора на 80% в спортивном режиме. Практический вывод: гибрид — для дальних поездок, чистый EV — для города.","u":"https://www.ixbt.com/car/deepal-s07-review.html","d":"ixbt.com"},"T1-01":{"t":"Электромобиль из США или Кореи не подключается к российским станциям: Type 1 и CCS1","s":"Машины из США и Кореи несут разъёмы Type 1/CCS1, которых на российских станциях почти нет. Нужен комплект: адаптер Type 2→Type 1 для AC (около 8 тыс ₽) и DC-адаптер CCS2→CCS1 (до 250 кВт). Для Nissan Leaf проще заряжаться на CHAdeMO-станциях. Важно: HomePlug/Powerline-адаптеры в домашней сети мешают зарядке (кейс MG ZS EV).","u":"https://elli.npoelm.ru/blog/tipy-razemov-zaryadnyh-stanciy","d":"elli.npoelm.ru"},"T1-02":{"t":"Американский EV заряжается от 220 В вдвое дольше: CCS1 рассчитан на 110 В","s":"CCS1 в США рассчитан на сеть 110 В, поэтому в российской 220-вольтовой розетке зарядка идёт дольше: 14 часов вместо 8. Американские Tesla с разъёмом NACS в Type 2-станции не влезают: для них есть адаптеры Type 2→Tesla (до 15 тыс ₽) и CCS2→Tesla (до 35 тыс ₽ — новые Tesla согласуют протокол сами), а также CHAdeMO→Tesla (до 80 тыс ₽, сняты с производства в 2021). Радикальный вариант — замена порта CCS1→CCS2 с перекодировкой блоков (делают в Подольске, VAGnetic).","u":"https://dzen.ru/a/Y-aiDB3dfg5-GEcf","d":"dzen.ru"},"T1-03":{"t":"Адаптер не держит ток станции: чем грозит 32-амперный переходник на станции 60 А","s":"Смотрите номинал тока на корпусе адаптера: если станция отдаёт 60 А, а адаптер рассчитан на 32 А, коннектор может перегреться и расплавиться. На станции всегда ставьте ток ниже номинала адаптера.","u":"https://dzen.ru/a/Y-aiDB3dfg5-GEcf","d":"dzen.ru"},"TS-01":{"t":"Tesla не заряжается на морозе: ниже 40% заряда и −22 °C зарядка не стартует","s":"Это защита батареи: ниже 40% заряда и при −22 °C Tesla не начнёт зарядку, пока батарея не прогреется. Проложите маршрут до Supercharger в навигаторе — машина начнёт греть батарею заранее. Помогает и precondition из приложения. Если вы уже на станции — просто подождите прогрева.","u":"https://habr.com/ru/news/708122/","d":"habr.com"},"TS-02":{"t":"Где заряжать Tesla в России: Supercharger дефицитен, NACS-версии не подключаются напрямую","s":"Сеть Supercharger в России частная и дефицитная, а американские версии с разъёмом NACS напрямую к станциям не подключаются. Практичный набор: CCS2-станции с адаптером (для европейских Tesla это родной разъём), частные Supercharger (Сколково) и домашняя станция Type 2 на 7–22 кВт.","u":"https://autoreview.ru/news/pervaya-chastnaya-zaryadka-tesla-supercharger-v-rossii-chto-dal-she","d":"autoreview.ru"},"LEAF-01":{"t":"Nissan Leaf не заряжается на CHAdeMO в мокрую погоду: выбивает ошибку","s":"Известная проблема Leaf: в дождь зарядка на CHAdeMO срывается. Частая причина — заземление станции или кабеля, нужна диагностика. Пока разбираетесь, заряжайтесь переменным током 7–22 кВт AC. Есть подробный видео-разбор на YouTube.","u":"https://www.youtube.com/watch?v=Bz2mefcEEHQ","d":"youtube.com"},"LEAF-02":{"t":"Батарея Leaf без охлаждения: почему быструю зарядку нельзя часто и в жару","s":"У Leaf нет жидкостного охлаждения батареи — быстрая зарядка «поджаривает» ячейки, а жара ускоряет деградацию. Включите Long Life Mode (лимит 80%), храните машину при 40–60%, быструю — не чаще раза в неделю и не в жару. Не забывайте про фирменное масло редуктора (1,5 л).","u":"https://auto.onliner.by/2025/10/06/nedorogo-pomenyal-batareyu","d":"auto.onliner.by"},"BYD-01":{"t":"BYD: меню на английском, минус 40% запаса зимой и дефицит трассовых зарядок","s":"Русификацию BYD выполняют сервисы, мастер-аккаунт помогает с настройками. Зимой LFP-батарея теряет до 40% запаса — спасает предпрогрев. Трассовые зарядки стройте заранее через PlugShare. Расширенная гарантия импортёра (100–200 тыс ₽) закрывает риски в отсутствие официального дилера.","u":"https://www.drive2.ru/b/738275329881160680/","d":"drive2.ru"},"BYD-02":{"t":"BYD Song: стучит шаровая после 6 тыс км и стружка в масле редуктора","s":"У Song L и родственных моделей шаровая опора может застучать уже после 6 тыс км — её меняют или восстанавливают. Масло в редукторе меняйте до 5 тыс км и далее каждые 20 тыс км — там находят стружку. ЛКП облезает на кромках — закрывается оклейкой плёнкой (около 3 тыс ₽).","u":"https://abw.by/news/experience/2025/09/11/zaryadka-krysha-slabye-mesta-i-gluki-chto-stoit-znat-pered-pokupkoi-elektromobilya-narodnoi-marki-byd","d":"abw.by"},"BYD-03":{"t":"Домашняя станция BYD не работает: нужна ключ-карта и заземление","s":"Комплектная станция BYD требует программирования ключ-карты: после сигнала держите карту у считывателя 30 секунд. Без контура заземления станция не запустится — проверьте заземление заранее. При сбое помогает красная кнопка перезапуска на корпусе станции.","u":"https://abw.by/news/experience/2025/09/11/zaryadka-krysha-slabye-mesta-i-gluki-chto-stoit-znat-pered-pokupkoi-elektromobilya-narodnoi-marki-byd","d":"abw.by"},"BYD-04":{"t":"Переходник CHAdeMO→GB/T на BYD не работает: как заряжаться быстро","s":"У BYD особенность электрики: адаптер CHAdeMO→GB/T не заводится. Быстрая зарядка возможна только через DC-адаптер CCS2→GB/T. Перед покупкой проверьте адаптер на конкретной станции, к которой ездите.","u":"https://www.drom.ru/info/test-drive/byd-song-plus-gb-t-99183.html","d":"drom.ru"},"ZE-01":{"t":"Zeekr 001 не развивает паспортные 150 кВт: станция без охлаждаемого кабеля режет мощность","s":"400-вольтовая платформа Zeekr 001 (не FR) на станциях со 150 кВт без жидкостного охлаждения кабеля получает только около 100 кВт. Ищите ЭЗС с высокотоковым кабелем. Версия FR на 800 В ограничений не имеет. Заряд 10–80% за 45–50 минут для 001 — норма.","u":"https://msk1.ru/text/auto/2024/02/08/73197305/","d":"msk1.ru"},"ZE-02":{"t":"Zeekr 9X: трещины заднего редуктора до 8 тыс км, ремонт 580–750 тыс ₽, отзывов в РФ нет","s":"Зафиксировано больше десяти случаев трещин заднего редуктора до 8 тыс км пробега. Перед покупкой проверяйте партию и VIN. Сервисы делают заварку и усиление за 30–50 тыс ₽. На ранних партиях избегайте агрессивных стартов: официальных отзывов в РФ нет, ремонт за свой счёт.","u":"https://dzen.ru/a/acpfGX-bk34tOTpG","d":"dzen.ru"},"ZE-03":{"t":"Zeekr 001 зимой ест 31–38 кВт/100 км: реальный запас хода около 300 км","s":"При −15…−20 °C реальный расход Zeekr 001 — 31–38 кВт/100 км, это около 300 км пробега. Планируйте по фактическим цифрам бортового компьютера: включайте режим «снег», паркуйтесь в тепле и держите заряд в коридоре 20–80%.","u":"https://www.drive2.ru/l/672159771557628270/","d":"drive2.ru"},"ZE-04":{"t":"Zeekr 001 после 2023 года не тянет трёхфазную станцию: OBC стал однофазным","s":"У Zeekr 001 2021–2022 годов OBC трёхфазный на 11 кВт, у версий 2023+ — однофазный на 7 кВт: трёхфазная станция не даст ускорения. Проверяйте год выпуска перед покупкой станции; для машин 2023+ хватит однофазной станции 7 кВт с автоматом 32 А.","u":"https://xn--80agenibdvfkjdv4m.xn--p1ai/blog/electromobili/chem-zaryazhat-zeekr-voyah-geely-vybor-stantsii","d":"xn--80agenibdvfkjdv4m.xn--p1ai"},"VO-01":{"t":"Voyah Free 2024–2025 не использует три фазы: OBC стал однофазным на 6,6 кВт","s":"У новых Voyah Free (2024–2025) бортовое зарядное однофазное на 6,6 кВт, раньше был трёхфазный на 11 кВт. Трёхфазная станция зарядку не ускорит — для AC хватит однофазной станции 7 кВт. У официальных поставок бывает трёхфазная опция за доплату. Проверяйте поколение машины перед покупкой станции.","u":"https://dzen.ru/a/aOzsu1Nb5W3J9wl8","d":"dzen.ru"},"VO-02":{"t":"Voyah Free 2022–2023: течь антифриза в инверторе грозит коротким замыканием","s":"На машинах до рестайла известна течь антифриза в инверторе — это риск КЗ, ремонт обходится примерно в 163+84 тыс ₽. Следите за уровнем антифриза и обслуживайтесь у профильных сервисов. Жёлтая ошибка — перезапуск, красная HV-ошибка — сразу эвакуатор.","u":"https://xn--80aaagkscw6aak8a.xn--p1ai/blog/voyah-free-problemy/","d":"xn--80aaagkscw6aak8a.xn--p1ai"},"VO-03":{"t":"Voyah простоял месяц с зарядом 20%: калибровка батареи обошлась в 25 тыс ₽","s":"После долгой стоянки с низким зарядом батарею приходится калибровать — в известном случае это стоило до 25 тыс ₽. На длительном простое держите уровень 40–60% или отключайте массу.","u":"https://xn--80aaagkscw6aak8a.xn--p1ai/blog/voyah-free-problemy/","d":"xn--80aaagkscw6aak8a.xn--p1ai"},"VO-04":{"t":"Voyah Free зимой едет 80–90 км вместо 170: что делать","s":"Зимний электропробег Voyah падает до 80–90 км даже на Sport с обещанными 170 км. Планируйте зарядки чаще, включайте ECO и предпрогрев, рассмотрите зимний пакет у дилера. На морозе также гудит редуктор и обмерзают щётки — это подтверждённые владельцами симптомы.","u":"https://xn--80aaagkscw6aak8a.xn--p1ai/blog/voyah-free-problemy/","d":"xn--80aaagkscw6aak8a.xn--p1ai"},"VO-05":{"t":"Матричный свет Voyah слепит встречных: прошивки с исправлением пока нет","s":"Ассистент дальнего света Voyah Sport+ 2025 срабатывает с задержкой и слепит встречные машины. Прошивки с исправлением ещё нет — переключайте ближний вручную и фиксируйте обращения в сервис письменно.","u":"https://xn--80aaagkscw6aak8a.xn--p1ai/blog/voyah-free-problemy/","d":"xn--80aaagkscw6aak8a.xn--p1ai"},"VO-06":{"t":"Voyah не дружит с некоторыми домашними станциями: приложение выдаёт ошибку","s":"Часть домашних GB/T-станций не стыкуется с Voyah — приложение сообщает об ошибке. Перед покупкой проверяйте совместимость (RFID или приложение) и берите станцию, которую владельцы Voyah уже используют.","u":"https://www.chinamobil.ru/faw/hongqi/e-hs9/?view=chats&chat=hongqi-club-chat&topic=4133","d":"chinamobil.ru"},"AV-01":{"t":"Avatr: ошибки ESP и HV, ограничение мощности, не заряжается на старых DC","s":"При сбоях помогает перезагрузка системы и обновление ПО. Перед покупкой проверьте машину на быстрой зарядке — часть старых DC-станций её не принимает. Любые дефекты фиксируйте письменно: технически сложный товар можно вернуть в течение 15 дней.","u":"https://saenko-group.ru/press-center/articles/defekty-avatr-12/","d":"saenko-group.ru"},"AV-02":{"t":"Avatr 11: течь трубок теплообменника батареи к 50–70 тыс км","s":"К 50–70 тыс км у Avatr 11 встречается течь трубок теплообменника батареи. Осматривайте днище на подтёки и меняйте антифриз только специнфризом. В мороз включайте предпрогрев — он снижает нагрузку на контур.","u":"https://cars-problem.ru/brand/avatr/11/11-2022","d":"cars-problem.ru"},"HO-01":{"t":"Hongqi E-HS9: вместо 505 км — 300 летом и 150–170 зимой","s":"Реальный пробег Hongqi E-HS9 — 300–350 км летом и 150–170 км зимой при обещанных 505 км. Заряжайте машину дома 3–7 кВт ночами и раз в неделю на быстрой. Заметно помогает ECO-режим «Большой запас хода». На московских ЭЗС инвертор быструю зарядку не развивает.","u":"https://www.avtovzglyad.ru/avto/test/67140-2025-09-08-gore-stoboyu-beda-bez-tebya-testdrayv-elektricheskogo-krossovera-hongqi-ehs9/","d":"avtovzglyad.ru"},"HO-02":{"t":"Hongqi E-HS9 не открывается после ночной зарядки: умирает 12В АКБ","s":"При простое с подключённой зарядкой 12В АКБ разряжается в ноль — машина не открывается. Официальный сервис меняет штатные АКБ по отзывной кампании. Возите бустер и не оставляйте машину на зарядке надолго без присмотра.","u":"https://www.chinamobil.ru/faw/hongqi/e-hs9/?view=chats&chat=hongqi-club-chat&topic=4133","d":"chinamobil.ru"},"HO-03":{"t":"Hongqi E-QM5: нет CarPlay и Android Auto, интерфейс тормозит","s":"Мультимедиа E-QM5 медлительная, CarPlay и Android Auto нет, камера слабая. Практичное решение — телефон-навигатор или беспроводной CarPlay-адаптер. На официальных поставках с 2024 года ставят русификацию.","u":"https://dzen.ru/a/ak_HXmC-VUo02PkW","d":"dzen.ru"},"GE-01":{"t":"Geely EX5: какой разъём у машины и чем её заряжать в России","s":"EX5 продаётся в РФ с Type 2 + CCS2, но в объявлениях и документах встречается путаница. Проверьте разъём по таблице на этой странице и по фото лючка. Для повседневной зарядки подойдёт портативное зарядное устройство или настенная станция 7–11 кВт.","u":"https://xn--80agenibdvfkjdv4m.xn--p1ai/blog/electromobili/chem-zaryazhat-zeekr-voyah-geely-vybor-stantsii","d":"xn--80agenibdvfkjdv4m.xn--p1ai"},"GE-02":{"t":"Geely Geometry C/E: разъём GB/T, быстрая зарядка до 60–70 кВт, сложная перепродажа","s":"Geometry C/E китайской сборки заряжаются через GB/T — для дома хватит AC-станции 7 кВт. Быстрая зарядка ограничена 60–70 кВт. Учтите ликвидность: продать такую машину на вторичке труднее.","u":"https://xn--80agenibdvfkjdv4m.xn--p1ai/blog/electromobili/chem-zaryazhat-zeekr-voyah-geely-vybor-stantsii","d":"xn--80agenibdvfkjdv4m.xn--p1ai"},"DE-01":{"t":"Deepal S07: реальный электропробег 150–160 км вместо 196, генератор включается при 15%","s":"Фактический электропробег S07 — 150–160 км при паспортных 196 км, а OBC принимает около 4,5 кВт даже от трёхфазной сети. При остатке ниже 15% сам включается генератор. Заряжайте ночью, используйте режим «только электричество» с пониманием его ограничений и настройте приём на 20 А домашней сети.","u":"https://www.ixbt.com/car/deepal-s07-review.html","d":"ixbt.com"},"DE-02":{"t":"Deepal не заряжается без заземления: плюс программные глюки и примёрзшие уплотнители","s":"Зарядное Deepal требует контур заземления — без него не стартует, монтируйте сразу правильно. От программных сбоев помогает сброс настроек (галочка «убрать раскачку»). Уплотнители зимой примерзают — спасает предпрогрев по таймеру за 10–15 минут до выезда.","u":"https://deepal-club.ru/threads/%D0%9E%D1%82%D0%B7%D1%8B%D0%B2%D1%8B-%D0%B2%D0%BB%D0%B0%D0%B4%D0%B5%D0%BB%D1%8C%D1%86%D0%B5%D0%B2-%D0%BF%D0%BB%D1%8E%D1%81%D1%8B-%D0%B8-%D0%BC%D0%B8%D0%BD%D1%83%D1%81%D1%8B-deepal-g318.171/page-2","d":"deepal-club.ru"},"MG-01":{"t":"MG ZS EV и MG4 «умирают» во время зарядки: садится 12В АКБ, кабель не выходит из порта","s":"Известная проблема: во время зарядки садится 12В АКБ — обе машины полностью обесточиваются, и замок порта не отдаёт кабель. Решение — замена АКБ. Заодно проверьте резисторный блок печки (исчезают нижние скорости). Для расписания зарядки дома помогает умный Wi-Fi-автомат.","u":"https://www.mgevs.com/threads/mg-4-mg-zs-evs-both-dead-12v-flat-while-charging.17040/page-2","d":"mgevs.com"},"MG-02":{"t":"MG ZS EV не заряжается от части домашних станций: конфликт с драйвером Rolec","s":"Часть домашних станций (драйвер Rolec) MG ZS EV не принимает — обновление ПО MG 2020 года решило конфликт. Попросите дилера оформить technical case и сделать обновление. Из домашней сети исключите HomePlug-адаптеры: они мешают связи станции и машины.","u":"https://www.mg-rover.org/threads/mg-zs-ev-serious-charging-issue-found.869548/page-3","d":"mg-rover.org"},"MG-03":{"t":"MG ZS EV первого поколения заряжается от розетки только 8,6 А вместо 10 А","s":"Штатное зарядное устройство ограничено 8,6 А при паспортных 10 А. Владельцы меняют блок на китайский аналог с индикацией тока, напряжения и мощности — зарядка идёт на полную.","u":"https://autoboom.co.il/ru/magazine/mg-zs-ev-anglochinese-electro-hit","d":"autoboom.co.il"},"KR-01":{"t":"Kia EV6 и Hyundai Ioniq 5: дефект ICCU разряжает 12В АКБ — известная проблема E-GMP","s":"Интегрированный контроллер заряда (ICCU) на платформе E-GMP выходит из строя, и 12В АКБ теряет заряд. Лечится заменой ICCU и АКБ по гарантии. Следите за напряжением 12В и при первых симптомах езжайте к дилеру — предупреждение «слабая АКБ» в EV звучит слишком поздно.","u":"https://www.drive2.ru/l/740075230415815824/","d":"drive2.ru"},"KR-02":{"t":"Kia и Hyundai из Кореи: разъём CCS1 и коммерческий утильсбор","s":"Корейские версии несут CCS1 — на российских станциях без переходников не обойтись: DC-адаптер CCS2→CCS1 (до 250 кВт) и Type 2→Type 1 для AC. Ещё до покупки посчитайте утильсбор: машины мощнее 80 л.с. идут по коммерческой ставке.","u":"https://export-motors.com/blog/elektromobili-iz-korei","d":"export-motors.com"},"EU-01":{"t":"VW ID.4: сенсорные ручки глючат на морозе, мультимедиа гаснет, Android не подключается","s":"Зимой выручает предпрогрев — ручки оживают. «Чёрный экран» мультимедиа лечится перепрошивкой (около 100 тыс ₽) или обновлением с флешки. CarPlay работает, Android подключается нестабильно — навигацию удобнее вести на телефоне через Яндекс Навигатор.","u":"https://www.e1.ru/text/auto/2024/02/06/73195712/","d":"e1.ru"},"EU-02":{"t":"Европейские EV на 20-дюймовых шинах с разными осями: подбор и экономика зарядки","s":"У ID.4, Q4 e-tron, Enyaq и iX на осях стоят шины разной ширины — комплект подбирайте вручную и планируйте замену заранее. Экономику зарядки решает ночной тариф: программируйте ночную зарядку — цена километра падает в разы.","u":"https://www.e1.ru/text/auto/2024/02/06/73195712/","d":"e1.ru"},"EVOL-01":{"t":"Evolute i-PRO: слабая печка, ломается клапан отопления, бракованные 12В АКБ","s":"Печку усиливают автономным отопителем (около 60 тыс ₽ у дилера, ставят «Бинар»). Клапан контура отопления меняют. Бракованные 12В АКБ садятся в ноль — их меняют. Дилерская сеть сжимается: ведите всю переписку письменно, чтобы была база для претензий.","u":"https://dzen.ru/a/ZdZSvOP6TXCbCoKh","d":"dzen.ru"},"EVOL-02":{"t":"Evolute без подогрева батареи: зимой зарядка и разгон проблемные","s":"Подогрева батареи у Evolute i-PRO нет (по словам сервиса есть только охлаждение) — зимой заряд и разряд идут тяжело. Помогают дизельный отопитель (аналог Вебасто), гараж и предпрогрев из приложения, если в вашей комплектации есть телематика. Для такси-эксплуатации машина тяжёлая — учитывайте при покупке.","u":"https://vk.ru/wall-93979119_78451","d":"vk.ru"},"EVOL-03":{"t":"Moskvich 3e: зарядное 2,3 кВт без таймера, лючок обмерзает","s":"Штатное зарядное даёт 2,3 кВт, таймера в машине нет — ставьте умную розетку или таймер на станции. Перед выездом делайте прогревочную подзарядку 30–40 минут: лючок оттаивает. Владельцы просят у инженеров режим «короткие поездки».","u":"https://ev-start.ru/reviews/vygonyaem-elektricheskiy-moskvich-na-moroz/","d":"ev-start.ru"},"AITO-01":{"t":"AITO M7: V2L есть, V2H/V2G в России не заявлены — как беречь батарею","s":"Питание приборов от машины (V2L) доступно, а обратную передачу в сеть (V2H/V2G) в РФ никто не заявлял. Следуйте рекомендациям BMS: держите заряд 20–80% в ежедневной езде и делайте предпрогрев перед быстрой зарядкой зимой. Раз в 30 тыс км проверяйте HV-соединения, охлаждающую жидкость батареи меняйте на 80–100 тыс км.","u":"https://kitajcar.ru/aito-huawei/aito-m7-2/battery/","d":"kitajcar.ru"},"EX-01":{"t":"Exlantix ET/ES: две версии разъёмов — легко купить не тот зарядный","s":"Для рынка РФ Exlantix выпускается и с Type 2/CCS2, и с GB/T — перед заказом зарядного или станции проверьте разъём по VIN или фото лючка. Подбор по конкретной модели есть в мини-приложении.","u":"https://xn--80agenibdvfkjdv4m.xn--p1ai/blog/electromobili/chem-zaryazhat-zeekr-voyah-geely-vybor-stantsii","d":"xn--80agenibdvfkjdv4m.xn--p1ai"},"MHE-01":{"t":"M-Hero 917: сбои гибридной системы и отказ зарядки — куда обращаться","s":"При сбоях гибридной системы, ограничении мощности и перегреве батареи обращайтесь письменно и фиксируйте повторность обращений — это важно для претензий. Обслуживайтесь в профильных сервисах по китайскому премиуму.","u":"https://saenko-group.ru/press-center/articles/vozvrat-m-hero-917/","d":"saenko-group.ru"}};

const SITE_CATALOG_URL='https://zapashoda-ev.ru/catalog/';
const SITE_TR={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',' ':'-','/':'-','.':'-','(':'',')':'',',':'','+':'','–':'-','—':'-'};
function slugRu(s){return s.toLowerCase().split('').map(function(c){return Object.prototype.hasOwnProperty.call(SITE_TR,c)?SITE_TR[c]:c}).join('').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');}
function modelSiteUrl(brand,model){return 'https://zapashoda-ev.ru/models/'+slugRu(brand)+'-'+slugRu(model)+'.html';}

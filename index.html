<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Запас хода — гид по зарядке и разъёмам электромобилей</title>
<style>
:root{
  --bg:#0E1621; --panel:#17212B; --panel2:#1E2A37; --line:#26313D;
  --text:#F4F7FA; --muted:#A7B4C2; --accent:#4CA1F0; --accent-soft:rgba(76,161,240,.16);
  --green:#2DB67D; --amber:#E6B45B; --red:#E15B64; --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:#0A0F16; font-family:-apple-system,'SF Pro Text',Roboto,'Segoe UI',Arial,sans-serif; color:var(--text); font-size:16px; -webkit-text-size-adjust:100%}
body{display:flex; justify-content:center; align-items:flex-start; min-height:100vh}
#frame{position:relative; width:100%; max-width:430px; height:100dvh; max-height:920px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden}
@media(min-width:480px){#frame{margin:12px 0; border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,.55); border:1px solid #1B2733}}
header{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:5}
.hback{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;flex:0 0 auto}
.htitle{flex:1;min-width:0}
.t1{font-weight:800;font-size:17px;letter-spacing:-.01em}
.t2{font-size:13.5px;color:var(--muted)}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
main{flex:1; overflow-y:auto; padding:14px 14px 30px; scroll-behavior:smooth}
.view{display:none; animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{margin:4px 0 14px}
.hero .h1{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.02em}
.hero .h2{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.5}
.field{margin-bottom:10px}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;font-size:16px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--accent)}
.lbl{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;cursor:pointer;user-select:none;transition:.15s}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#fff;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.m-card{cursor:pointer;transition:.15s}
.m-card:active{transform:scale(.985)}
.m-name{font-weight:700;font-size:16px}
.m-meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
.tagX{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.ok{background:rgba(45,182,125,.16);color:var(--green)}
.tag.check{background:rgba(230,180,91,.16);color:var(--amber)}
.port-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.port-row:last-child{border-bottom:none}
.port-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;background:var(--panel2);border:1px solid var(--line)}
.port-lbl{font-size:13px;color:var(--muted)}
.port-val{font-weight:700;font-size:15.5px;margin-top:2px}
.port-hint{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.big-name{font-weight:800;font-size:21px;line-height:1.25;letter-spacing:-.02em}
.note{border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.55;margin:12px 0}
.note.amber{background:rgba(230,180,91,.09);border:1px solid rgba(230,180,91,.22)}
.note.green{background:rgba(45,182,125,.09);border:1px solid rgba(45,182,125,.22)}
.note.blue{background:var(--accent-soft);border:1px solid rgba(51,144,236,.3)}
.sol-item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.sol-item:last-child{border-bottom:none}
.sol-badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;margin-top:1px}
.sol-badge.need{background:rgba(45,182,125,.16);color:var(--green)}
.sol-badge.opt{background:var(--accent-soft);color:var(--accent)}
.sol-badge.no{background:rgba(139,152,165,.12);color:var(--muted)}
.sol-name{font-weight:700;font-size:13.5px}
.sol-desc{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.55}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px}
.gl-name{font-weight:800;font-size:16.5px}
.gl-sub{font-size:13px;color:var(--accent);font-weight:600;margin-top:2px}
.gl-desc{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.55}
.pain-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--panel2)}
.pain-card:last-child{margin-bottom:0}
.pain-t{font-weight:700;font-size:15px;line-height:1.35}
.pain-s{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.55}
.pain-src{font-size:13px;color:var(--accent);cursor:pointer;margin-top:9px;display:inline-block}
.pain-more{display:block;text-align:center;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;padding:10px 0 4px}
.pn-chip{display:inline-block;font-size:13px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer}
.pn-chip:active{background:var(--accent-soft)}
.pn-chip.pn-more{cursor:default;background:transparent;border-color:transparent;color:var(--muted);padding:5px 2px}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mod-tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:pointer}
.mod-tile:active{background:var(--accent-soft)}
.mod-b{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.mod-t{font-weight:700;font-size:15.5px;line-height:1.3;margin-top:4px}
.mod-y{font-size:12.5px;color:var(--muted);margin-top:4px}
.top-b{font-size:13px;font-weight:800;padding:7px 12px}
.demo-banner{
.onb-m{padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px;font-weight:600;cursor:pointer}
.onb-m:active{background:var(--accent-soft)}
.pn-chip.pn-on{background:var(--accent);color:#fff;border-color:var(--accent)}
.b-light{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;padding:13px}
.b-light:active{opacity:.8}
.demo-banner{font-size:12.5px;color:var(--amber);background:rgba(230,180,91,.09);border:1px solid rgba(230,180,91,.25);border-radius:10px;padding:8px 12px;margin-bottom:12px;text-align:center}
.sol-link{display:inline-block;margin:0 6px 6px 0;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(51,144,236,.3);border-radius:9px;padding:5px 10px;cursor:pointer}
.prod-detail{padding:10px 0 6px 52px;border-top:1px dashed var(--line);margin-top:2px}
.pd-mini{display:flex;gap:12px}
.pd-mini img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--line);flex:0 0 auto}
.mini-emoji{width:72px;height:72px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}
.buy-mini{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}

</style>
</head>
<body>
<div id="frame">
  <header>
    <button class="hback" id="backBtn" onclick="goBack()" hidden>‹</button>
    <div class="htitle" onclick="goHome()" style="cursor:pointer">
      <div class="t1">🔋 Запас хода</div>
      <div class="t2">гид по твоему электромобилю</div>
    </div>
    <button class="hbtn" onclick="showView('gloss')">?</button>
  </header>
  <main id="main">
    
    <section class="view active" id="v-home"></section>
    <section class="view" id="v-model"></section>
    <section class="view" id="v-gloss"></section>
    </main>
<nav id="tabbar">
  <button class="tb on" data-t="home" onclick="tabGo('home')"><span class="tb-ico">🚗</span><span class="tb-lbl">Моя EV</span></button>
  <button class="tb" data-t="site" onclick="openSite(SITE_CATALOG_URL);evTrack('site_open')"><span class="tb-ico">🌐</span><span class="tb-lbl">Сайт</span></button>
  <button class="tb" data-t="gloss" onclick="tabGo('gloss')"><span class="tb-ico">📖</span><span class="tb-lbl">Справочник</span></button>
</nav>
</div>
<script>
window.onerror=function(msg,src,line){try{var h=document.getElementById('v-home');if(h&&!h.innerHTML.trim()){h.innerHTML='<div class="card" style="border-color:var(--red)">'+'<div style="font-weight:800;margin-bottom:6px">\u26a0\ufe0f Ошибка интерфейса</div>'+'<div style="font-size:13px;color:var(--muted)">'+String(msg).slice(0,120)+' (строка '+line+')</div>'+'<button class="b-add" style="width:100%;padding:12px;margin-top:10px" onclick="try{localStorage.removeItem(\'ev_my_car\')}catch(e){} if(typeof renderHome===\'function\'){document.getElementById(\'v-home\').innerHTML=\'\';try{renderHome()}catch(e2){}}">Попробовать восстановить</button>'+'<button class="b-light" style="width:100%;padding:12px;margin-top:8px" onclick="openSite(\'https://zapashoda-ev.ru/\')">Каталог и гайды \u2014 на сайте</button>';}}catch(e){}};
var PAIN={"GB-01":{"t":"Китайский электромобиль не заряжается от российской станции: оба порта машины — GB/T","s":"Спокойно: машина не сломана — у неё оба разъёма китайские (GB/T). Европейские Type 2 и CCS2 без переходника не подойдут. Возите с собой адаптер Type 2→GB/T для города, а на трассе либо ищите станции с пистолетом GB/T, либо берите DC-адаптер CCS2→GB/T. И проверьте заранее, выдаёт ли станция кабель — «столбики» без кабеля встречаются.","l":"adapter-gbt"},"GB-02":{"t":"Почему станция на 22 кВт заряжает китайский EV только на 7 кВт: однофазный OBC","s":"Не тратьте деньги на 22 кВт зря: у ~95% китайских машин зарядное однофазное, около 7 кВт. Трёхфазная станция даст лишь треть мощности. Гляньте фазность своей модели в разделе «Модели» — если OBC однофазный, вам хватит обычной станции на 7 кВт.","l":"domashnie-stancii"},"GB-03":{"t":"Поездка в Европу на китайском EV: без переходников не зарядиться — там всё CCS2 и Type 2","s":"В Европе всё наоборот: Type 2 и CCS2, а у вас GB/T. Берите с собой оба переходника — Type 2→GB/T и DC CCS2→GB/T. И перед дальней дорогой опробуйте адаптер на тех станциях, которые будут по маршруту: не все дружат со всеми."},"GB-04":{"t":"DC-адаптер CCS2→GB/T не работает на части станций: несовместимость протоколов","s":"DC-адаптер «уговаривает» станцию сигналами, и часть станций его не понимает. Берите свежие версии с обновляемой прошивкой и просите у продавца список проверенных станций (ABB, Siemens, Alpitronic и другие). Прошивку обновляйте — это лечит большинство сбоев.","l":"adapter-gbt"},"GB-05":{"t":"Садится батарейка в DC-адаптере CCS2→GB/T: хватает на 3–5 сессий","s":"Внутри DC-адаптера стоит батарейка 18650 — её хватает на несколько сессий. Берите версию со сменным отсеком или с авточарджем: у некоторых адаптеров отсека для замены нет вообще. Подзарядить можно заранее, но медленно.","l":"adapter-gbt"},"GB-06":{"t":"Где зарядить китайский EV: быстрых станций с GB/T мало, почти вся сеть — CCS2 и Type 2","s":"Быстрых GB/T-станций в России мало — основная сеть работает на CCS2 и Type 2. Перед поездкой стройте маршрут в PlugShare или 2Charge с фильтром GB/T. А DC-адаптер CCS2→GB/T открывает доступ ко всей сети CCS2: один адаптер — и трасса перестаёт быть проблемой.","l":"zaryadka-na-trasse"},"GB-07":{"t":"Зарядка китайского EV от розетки 220 В идёт медленно (2,8–3,5 кВт) — что с этим делать","s":"От бытовой розетки любая GB/T-машина даёт 2,8–3,5 кВт — и это нормально, не ищите поломку. Если заряжаетесь дома каждую ночь, поставьте настенную станцию 7 кВт: ей нужны отдельная линия и автомат 32 А. Штатные розеточные схемы Li Auto работают так же неторопливо.","l":"zaryadka-ot-rozetki"},"GB-08":{"t":"При зарядке от удлинителя перегревается кабель и вышибает автоматы: сечение, линия, автомат","s":"Обычный удлинитель для зарядки не предназначен: контакты греются, автоматы выбивает. Правильная схема — отдельная линия 3×6 мм² с автоматом 32 А. Пока проводка слабая, снизьте ток в настройках машины (8–16 А) или возьмите станцию с балансировкой нагрузки.","l":"zaryadka-ot-rozetki"},"UN-01":{"t":"Электромобиль медленно заряжается в мороз: холодная батарея принимает мало тока","s":"Холодная батарея принимает в 1,5–2 раза меньше тока — зарядка дольше, и это не поломка. Грейте батарею: проложите маршрут до станции в навигаторе (машина прогреет её в пути) или запустите предпрогрев из приложения. Лучшая зарядка — сразу после поездки, «на горячую».","l":"zapas-hoda-zimoy"},"UN-02":{"t":"Можно ли заряжать электромобиль, если порт в льду или инее","s":"Если порт в льду или инее — не подключайтесь, есть риск короткого замыкания. Осмотрите разъёмы на конденсат, резиновые заглушки держите при себе. У Deepal S7 есть режим сушки порта — он прогревает его перед подключением.","l":"lyuchok"},"UN-03":{"t":"Зарядка не стартует или прерывается: сбой согласования машины и станции","s":"Зарядка не стартует или обрывается? Чаще всего это спор прошивок машины и станции — особенно у китайских EV на старых зарядках. Вытащите кабель, подождите минуту, воткните снова. Не помогло — соседняя колонка: если сбоит только одна станция, дело в ней, а не в машине.","l":"ne-zaryazhaetsya"},"UN-04":{"t":"Кабель зарядки не выходит из порта: замок не разблокировал коннектор","s":"Сессия закончилась, а кабель «прилип» — замок порта не разжался. Такое бывает у Zeekr 001/X, BYD Atto 3 и многих других. Разблокируйте машину и убедитесь, что зарядка завершена. Застрял намертво — аварийный тросик или кнопка в лючке.","l":"kabel-ne-otdaet"},"UN-05":{"t":"Лючок зарядки примерзает и не открывается на морозе: как открыть","s":"Прогревайте порт из приложения до выезда — лючок отойдёт сам. У Moskvich 3e лючок оттаивает после 40 минут в розетке. Совсем примёрзло — ищите аварийный тросик: у Li Auto L7 он за лючком.","l":"lyuchok"},"ZV-01":{"t":"Тугой лючок зарядки: на морозе механизм примораживает крышку","s":"На морозе крышка лючка примораживает — смазывайте механизм периодически. Подходит силиконовая смазка из каталога (SKU 17) — живёт в бардачке.","l":"lyuchok"},"UN-06":{"t":"Не хватает длины кабеля на парковке: какой кабель взять","s":"Кабеля не хватает? Замерьте своё парковочное место заранее и берите кабель 10 м (SKU 15) или удлинитель GB/T (SKU 14) — без переплаты за лишние метры.","l":"udlinitel"},"ZM-01":{"t":"Запас хода зимой падает на 25–45%: почему и как вернуть километры","s":"На морозе −20 °C LFP теряет 35–45% запаса, NMC — 25–35%: это физика, а не брак. Работает банальное: предпрогрев от сети, подогрев сидений вместо печки, тёплый паркинг, ночной таймер зарядки. Поездки длиннее 20 км греют батарею сами. А агрессивный газ добавит ещё 25–30% расхода.","l":"zapas-hoda-zimoy"},"ZM-02":{"t":"Электромобиль едет вяло на холодной батарее: поломка это или защита","s":"Это защита, а не поломка: холодная батарея не отдаёт полную мощность. Прогреется — и машина снова бодрая. Запускайте предпрогрев из приложения перед выездом, и разницу почти не заметите.","l":"zapas-hoda-zimoy"},"ZM-03":{"t":"Замерзают двери и уплотнители: сенсорные ручки не срабатывают на морозе","s":"Двери и уплотнители примерзают — таймерный прогрев за 10–15 минут до выхода решает. У VW ID сенсорные ручки мёрзнут особенно обидно, там прогрев обязателен.","l":"zapas-hoda-zimoy"},"ZM-04":{"t":"Дверное стекло примерзает к уплотнителю: что сделать заранее","s":"Обработайте стёкла антидождём или аквапелью ещё осенью: вода и лёд липнут хуже, стекло реже примерзает к уплотнителю.","l":"zapas-hoda-zimoy"},"ZM-05":{"t":"Автопилот и круиз-контроль зимой отказывают: грязные камеры и сенсоры","s":"Ассистенты отключаются? Зимой камеры и радары забивает грязь и реагент. Мойте зону датчиков чаще и держите ручной режим наготове.","l":"zapas-hoda-zimoy"},"BAT-01":{"t":"Быстрая зарядка убивает батарею Leaf: минус 10–15% ёмкости за 50 циклов","s":"У Leaf батарея без жидкостного охлаждения, и частые CHAdeMO-сессии её честно «поджаривают». Быструю — не чаще раза в неделю, повседневно — до 80%. SOH смотрите через Leaf Spy Pro, летом — тень, на стоянке — 30–50%.","l":"chademo"},"BAT-02":{"t":"Как правильно хранить батарею электромобиля: 0% и 100% ускоряют деградацию","s":"Живите в коридоре 20–80%, на длительной стоянке — 40–60%. Полный цикл до 100% полезен 2–3 раза в год для калибровки показаний — так, например, калибруется Voyah."},"BAT-03":{"t":"LFP-батарея теряет до 40% зимой: это норма химии, а не брак (BYD Blade)","s":"Минус 30–40% у LFP (BYD Blade) на −20 °C — свойство химии, а не дефект. Реально снизить потери до ~25%: предпрогрев, обогрев батареи, зимние шины, ровный газ. И не опускайте заряд ниже 5% в морозы.","l":"zapas-hoda-zimoy"},"BAT-04":{"t":"12-вольтовый аккумулятор электромобиля садится: машина не оживает и сыпет ошибками","s":"Виновник частенько — 12-вольтовый АКБ: долгая стоянка, ключ рядом, обновления ПО — и утром машина «мёртвая» с каскадом ошибок. Раз в месяц меряйте напряжение, клеммы держите чистыми, ключ дальше 15 м, на стоянке отключайте массу. У Kia EV6/Ioniq 5 известный дефект ICCU — меняют по гарантии; у Evolute были бракованные АКБ — тоже меняют.","l":"12v-akb"},"BAT-05":{"t":"Сколько стоит замена батареи: Leaf 40 кВт·ч — около 800 тыс ₽, VW ID.4 — больше миллиона","s":"Замена батареи — самая дорогая операция: VW ID.4 — больше миллиона, Leaf 40 кВт·ч — около 800 тыс ₽. Для Leaf есть рынок б/у и перепаковка на элементы CATL. Перед покупкой всегда смотрите SOH: деградация больше 10% — повод торговаться."},"ST-01":{"t":"Нет сервиса и запчастей для китайского EV: ожидать приходится 2–4 месяца","s":"Официального представительства у большинства китайских брендов в РФ нет — запчасти идут 2–4 месяца. Берите машину у импортёра со своим сервисом, держите запас расходников и найдите профильный сервис по китайцам заранее — клубы владельцев подскажут, где."},"ST-02":{"t":"Меню на китайском, навигация не работает в России: как русифицировать электромобиль","s":"Меню на китайском решается тремя путями: русификация в сервисе (30–80 тыс ₽), CarPlay или Android Auto — если модель поддерживает, или Яндекс Навигатор на телефоне. У BYD CarPlay и Android Auto появляются с поддержкой конкретной модели."},"ST-03":{"t":"Китайский EV быстро теряет в цене: минус 40–47% за три года","s":"Китайцы дешевеют на 40–47% за три года, премиум — хуже всех (Hongqi E-HS9: с 13 до 4 млн ₽). Считайте полную стоимость владения и не берите «серые» машины без гарантии. История машины важна: такси и каршеринг изнашивают батарею в 1,5–2 раза быстрее."},"ST-04":{"t":"Утильсбор 2026: льготный порог 80 л.с. — почти ни один EV под него не проходит","s":"Льготный утильсбор с 2026 года действует только до 80 л.с. — под него почти ни один EV не попадает. Считайте цену «под ключ» заранее: у части моделей до 160 л.с. сбор выходит дешевле. Мощность конкретной версии проверяйте до покупки."},"ST-05":{"t":"Отзывные кампании не доходят до РФ: ремонт Zeekr 9X стоит 580–750 тыс ₽","s":"Заводские отзывы до нас часто не доезжают: владельцы Zeekr 9X с трещинами редуктора чинят за 580–750 тыс ₽ сами. Проверяйте VIN и партию до покупки, усиление делают за 30–50 тыс ₽. Страховка и юрист на связи — не роскошь."},"PHEV-01":{"t":"Почему EREV включает бензогенератор раньше, чем батарея разрядится","s":"Не ждите честных «100% электричества»: на 15–16% заряда генератор включится сам — так устроены EREV (Deepal S07). Планируйте 130–150 км в день с вечерней розеткой — тогда бензин не тратится. Зимой электропробег минус ещё 20–35%."},"PHEV-02":{"t":"Li Auto после обновления заряжается от нештатных зарядок только 8 А: как вернуть 16 А","s":"Обновления Li Auto резали ток от сторонних зарядок до 8 А. Напишите в поддержку через приложение — одобрят заявление на 16 А (после версии 5.0.4). В 5.1 и выше ток просто поднимается бегунком в настройках."},"PHEV-03":{"t":"EREV зимой на трассе: батарея садится, генератор жжёт бензин","s":"Зимой батарея EREV садится быстрее, и генератор подхватывает бензином — городская экономия на трассе заканчивается. Держите заряд в спортивном режиме на 80%. Коротко: гибрид — для дальняка, чистый EV — для города."},"T1-01":{"t":"Электромобиль из США или Кореи не подключается к российским станциям: Type 1 и CCS1","s":"Машины из США и Кореи несут Type 1/CCS1, которых у нас почти нет. Соберите комплект: адаптер Type 2→Type 1 (около 8 тыс ₽) и DC CCS2→CCS1 (до 250 кВт). Leaf проще живёт на CHAdeMO. И уберите из домашней сети HomePlug-адаптеры — они ссорят станцию с машиной (кейс MG ZS EV).","l":"type1-ccs1"},"T1-02":{"t":"Американский EV заряжается от 220 В вдвое дольше: CCS1 рассчитан на 110 В","s":"CCS1 заточен под 110 В, поэтому от нашей розетки зарядка идёт вдвое дольше — 14 часов вместо 8. Американские Tesla с NACS в Type 2 не влезают: адаптер Type 2→Tesla (до 15 тыс ₽), CCS2→Tesla (до 35 тыс ₽ — новые Tesla согласуют протокол сами), CHAdeMO→Tesla снят с производства в 2021. Радикально — перепайка порта CCS1→CCS2 (делают в Подольске, VAGnetic).","l":"tesla"},"T1-03":{"t":"Адаптер не держит ток станции: чем грозит 32-амперный переходник на станции 60 А","s":"Смотрите номинал на корпусе адаптера: станция на 60 А против адаптера на 32 А — это расплавленный коннектор. Ток на станции всегда ставьте ниже номинала адаптера.","l":"adapter-gbt"},"TS-01":{"t":"Tesla не заряжается на морозе: ниже 40% заряда и −22 °C зарядка не стартует","s":"Ниже 40% заряда и при −22 °C Tesla просто не начнёт зарядку, пока батарея холодная — это защита. Проложите маршрут до Supercharger в навигаторе: машина начнёт греть батарею сама. Уже на станции — просто подождите прогрева.","l":"tesla"},"TS-02":{"t":"Где заряжать Tesla в России: Supercharger дефицитен, NACS-версии не подключаются напрямую","s":"Supercharger в России частный и дефицитный, а NACS-версии напрямую к станциям не подключаются. Рабочая связка: CCS2-сеть через адаптер (для европейских Tesla это родной разъём), частные Supercharger (Сколково) и домашняя станция Type 2 на 7–22 кВт.","l":"tesla"},"LEAF-01":{"t":"Nissan Leaf не заряжается на CHAdeMO в мокрую погоду: выбивает ошибку","s":"Дождь плюс CHAdeMO — сорванная зарядка, известная болячка Leaf. Чаще всего дело в заземлении станции или кабеля — нужна диагностика. Пока разбираетесь, заряжайтесь переменным током 7–22 кВт AC.","l":"chademo"},"LEAF-02":{"t":"Батарея Leaf без охлаждения: почему быструю зарядку нельзя часто и в жару","s":"У Leaf нет жидкостного охлаждения — быстрая зарядка и жара убивают батарею быстрее. Включайте Long Life Mode (лимит 80%), храните при 40–60%, быструю — редко и не в жару. И не забывайте про фирменное масло редуктора (1,5 л).","l":"chademo"},"BYD-01":{"t":"BYD: меню на английском, минус 40% запаса зимой и дефицит трассовых зарядок","s":"Русификацию BYD выполняют сервисы, мастер-аккаунт помогает с настройками. Зимой LFP теряет до 40% — спасает предпрогрев. Расширенная гарантия импортёра (100–200 тыс ₽) закрывает отсутствие официального дилера."},"BYD-02":{"t":"BYD Song: стучит шаровая после 6 тыс км и стружка в масле редуктора","s":"У Song L шаровая может застучать уже после 6 тыс км — меняется или восстанавливается. Масло редуктора меняйте до 5 тыс км и дальше каждые 20 тыс — там находят стружку. ЛКП по кромкам облазит — плёнка за ~3 тыс ₽ решает."},"BYD-03":{"t":"Домашняя станция BYD не работает: нужна ключ-карта и заземление","s":"Комплектная станция BYD требует программирования ключ-карты: держите карту у считывателя 30 секунд после сигнала. Без заземления не запустится — проверьте контур заранее. Зависла — красная кнопка перезапуска на корпусе.","l":"domashnie-stancii"},"BYD-04":{"t":"Переходник CHAdeMO→GB/T на BYD не работает: как заряжаться быстро","s":"У BYD особая электрика: переходник CHAdeMO→GB/T не заводится вообще. Быстрая зарядка возможна только через DC-адаптер CCS2→GB/T. И проверяйте адаптер на «своей» станции до покупки.","l":"adapter-gbt"},"ZE-01":{"t":"Zeekr 001 не развивает паспортные 150 кВт: станция без охлаждаемого кабеля режет мощность","s":"400-вольтовый Zeekr 001 (не FR) на станциях 150 кВт без охлаждаемого кабеля получает около 100 кВт — кабель режет мощность. Ищите ЭЗС с высокотоковым кабелем. FR на 800 В — без ограничений. 10–80% за 45–50 минут — норма.","l":"zaryadka-na-trasse"},"ZE-02":{"t":"Zeekr 9X: трещины заднего редуктора до 8 тыс км, ремонт 580–750 тыс ₽, отзывов в РФ нет","s":"По редуктору Zeekr 9X зафиксировано больше десяти случаев трещин до 8 тыс км. Перед покупкой — VIN и партия. Сервисы делают заварку с усилением за 30–50 тыс ₽. Отзывов в РФ нет — ремонт за свой счёт, на ранних партиях избегайте агрессивных стартов."},"ZE-03":{"t":"Zeekr 001 зимой ест 31–38 кВт/100 км: реальный запас хода около 300 км","s":"При −15…−20 °C Zeekr 001 ест 31–38 кВт/100 км — это около 300 км реального пробега. Планируйте по бортовому компьютеру, а не по брошюре: режим «снег», тёплый паркинг, коридор 20–80%.","l":"zapas-hoda-zimoy"},"ZE-04":{"t":"Zeekr 001 после 2023 года не тянет трёхфазную станцию: OBC стал однофазным","s":"У Zeekr 001 2021–2022 годов OBC трёхфазный на 11 кВт, у версий 2023+ — однофазный на 7 кВт. Трёхфазная станция для новых версий — деньги на ветер: хватит однофазной 7 кВт с автоматом 32 А. Проверяйте год до покупки станции.","l":"domashnie-stancii"},"VO-01":{"t":"Voyah Free 2024–2025 не использует три фазы: OBC стал однофазным на 6,6 кВт","s":"Новые Voyah Free (2024–2025) — однофазное зарядное 6,6 кВт вместо прежних трёхфазных 11 кВт. Трёхфазная станция зарядку не ускорит: для AC хватит однофазной 7 кВт. У официальных поставок бывает трёхфазная опция за доплату — проверяйте поколение.","l":"domashnie-stancii"},"VO-02":{"t":"Voyah Free 2022–2023: течь антифриза в инверторе грозит коротким замыканием","s":"На дорестайле Voyah Free известна течь антифриза в инверторе — это риск КЗ, ремонт обходится примерно в 163+84 тыс ₽. Следите за уровнем антифриза и обслуживайтесь у профильных сервисов. Жёлтая ошибка — перезапуск; красная HV-ошибка — сразу эвакуатор, не рискуйте."},"VO-03":{"t":"Voyah простоял месяц с зарядом 20%: калибровка батареи обошлась в 25 тыс ₽","s":"Voyah простоял месяц с зарядом 20% — батарея потребовала калибровки на 25 тыс ₽. Правило простое: на долгой стоянке держите 40–60% или отключайте массу."},"VO-04":{"t":"Voyah Free зимой едет 80–90 км вместо 170: что делать","s":"Зимой Voyah Free едет 80–90 км вместо обещанных 170 — даже на Sport. Планируйте зарядки чаще, включайте ECO и предпрогрев. На морозе также гудит редуктор и обмерзают щётки — известные владельцам симптомы, не пугайтесь."},"VO-05":{"t":"Матричный свет Voyah слепит встречных: прошивки с исправлением пока нет","s":"Матричный свет Voyah Sport+ 2025 срабатывает с задержкой и слепит встречные машины. Прошивки с исправлением пока нет: переключайте ближний вручную и фиксируйте обращения в сервис письменно — это база для претензии."},"VO-06":{"t":"Voyah не дружит с некоторыми домашними станциями: приложение выдаёт ошибку","s":"Часть домашних GB/T-станций с Voyah не стыкуется — приложение рапортует об ошибке. Перед покупкой проверяйте совместимость и берите станцию, на которой владельцы Voyah уже заряжаются."},"AV-01":{"t":"Avatr: ошибки ESP и HV, ограничение мощности, не заряжается на старых DC","s":"Ошибки ESP/HV и ограничение мощности у Avatr лечатся перезагрузкой системы и обновлением ПО. Перед покупкой обязательно опробуйте быструю зарядку — часть старых DC-станций машину не принимает. Дефекты фиксируйте письменно: технически сложный товар можно вернуть в течение 15 дней."},"AV-02":{"t":"Avatr 11: течь трубок теплообменника батареи к 50–70 тыс км","s":"К 50–70 тыс км у Avatr 11 встречается течь трубок теплообменника батареи. Осматривайте днище на подтёки и лейте только специнфриз. Мороз переносите с предпрогревом — он разгружает контур."},"HO-01":{"t":"Hongqi E-HS9: вместо 505 км — 300 летом и 150–170 зимой","s":"Реальный пробег E-HS9 — 300–350 км летом и 150–170 зимой против паспортных 505 км. Заряжайте дома 3–7 кВт ночами и раз в неделю на быстрой. ECO «Большой запас хода» реально помогает. На московских ЭЗС инвертор быструю не выдаёт — учитывайте."},"HO-02":{"t":"Hongqi E-HS9 не открывается после ночной зарядки: умирает 12В АКБ","s":"После ночи на зарядке машина не открывается? Это 12В АКБ: у E-HS9 она разряжается в ноль при простое с подключённой зарядкой. Официальный сервис меняет АКБ по отзывной кампании. Возите бустер и не оставляйте машину «на зарядке навсегда».","l":"12v-akb"},"HO-03":{"t":"Hongqi E-QM5: нет CarPlay и Android Auto, интерфейс тормозит","s":"У E-QM5 мультимедиа тормозит, CarPlay и Android Auto нет, камера слабая. Практично: телефон-навигатор или беспроводной CarPlay-адаптер. На официальных поставках с 2024 года русификация стоит из коробки."},"GE-01":{"t":"Geely EX5: какой разъём у машины и чем её заряжать в России","s":"EX5 в РФ продаётся с Type 2 + CCS2, но в объявлениях встречается путаница. Проверьте разъём по фото лючка — на странице модели в разделе «Модели» всё разложено. Для дома хватит портативки или станции 7–11 кВт."},"GE-02":{"t":"Geely Geometry C/E: разъём GB/T, быстрая зарядка до 60–70 кВт, сложная перепродажа","s":"Geometry C/E китайской сборки заряжаются через GB/T: для дома хватит AC-станции 7 кВт, быстрая ограничена 60–70 кВт. И честно: продать такую машину на вторичке труднее — учитывайте при выборе."},"DE-01":{"t":"Deepal S07: реальный электропробег 150–160 км вместо 196, генератор включается при 15%","s":"Фактический электропробег S07 — 150–160 км против паспортных 196, а OBC принимает около 4,5 кВт даже от трёх фаз. Ниже 15% сам включается генератор. Заряжайте ночью, а режим «только электричество» используйте с пониманием его ограничений."},"DE-02":{"t":"Deepal не заряжается без заземления: плюс программные глюки и примёрзшие уплотнители","s":"Зарядное Deepal без контура заземления просто не стартует — монтируйте сразу правильно. От программных глюков помогает сброс настроек (галочка «убрать раскачку»). Примёрзшие уплотнители — таймерный прогрев за 10–15 минут до выезда.","l":"domashnie-stancii"},"MG-01":{"t":"MG ZS EV и MG4 «умирают» во время зарядки: садится 12В АКБ, кабель не выходит из порта","s":"Классика MG: во время зарядки садится 12В АКБ, машина обесточивается целиком, и замок порта не отдаёт кабель. Лечится заменой АКБ. Заодно проверьте резисторный блок печки (исчезают нижние скорости). Для ночного расписания зарядки — умный Wi-Fi-автомат.","l":"12v-akb"},"MG-02":{"t":"MG ZS EV не заряжается от части домашних станций: конфликт с драйвером Rolec","s":"Часть домашних станций с драйвером Rolec MG ZS EV не принимает — обновление ПО MG 2020 года конфликт решило. Попросите дилера оформить technical case и обновить ПО. HomePlug-адаптеры из домашней сети уберите — они мешают связи станции и машины."},"MG-03":{"t":"MG ZS EV первого поколения заряжается от розетки только 8,6 А вместо 10 А","s":"Штатное зарядное MG ZS EV первого поколения ограничено 8,6 А при паспортных 10 А. Владельцы ставят китайский аналог с индикацией тока, напряжения и мощности — и зарядка идёт на полную."},"KR-01":{"t":"Kia EV6 и Hyundai Ioniq 5: дефект ICCU разряжает 12В АКБ — известная проблема E-GMP","s":"Дефект ICCU на платформе E-GMP (Kia EV6, Ioniq 5) разряжает 12В АКБ. Лечится заменой ICCU и АКБ по гарантии. Следите за напряжением 12В: предупреждение «слабая АКБ» появляется слишком поздно — при первых симптомах к дилеру.","l":"12v-akb"},"KR-02":{"t":"Kia и Hyundai из Кореи: разъём CCS1 и коммерческий утильсбор","s":"Корейские версии несут CCS1: без переходников никуда — DC-адаптер CCS2→CCS1 (до 250 кВт) и Type 2→Type 1 для AC. И считайте утильсбор заранее: мощнее 80 л.с. — коммерческая ставка.","l":"type1-ccs1"},"EU-01":{"t":"VW ID.4: сенсорные ручки глючат на морозе, мультимедиа гаснет, Android не подключается","s":"Зимой сенсорные ручки ID.4 глючат — предпрогрев их оживляет. «Чёрный экран» мультимедиа лечится перепрошивкой (около 100 тыс ₽) или обновлением с флешки. CarPlay работает, Android — нестабильно: навигацию проще вести на телефоне."},"EU-02":{"t":"Европейские EV на 20-дюймовых шинах с разными осями: подбор и экономика зарядки","s":"На осях ID.4, Q4 e-tron, Enyaq и iX стоят шины разной ширины — комплект подбирайте вручную и заказывайте заранее. Экономику зарядки решает ночной тариф: программная ночная зарядка режет цену километра в разы."},"EVOL-01":{"t":"Evolute i-PRO: слабая печка, ломается клапан отопления, бракованные 12В АКБ","s":"Печку Evolute усиливают автономным отопителем (~60 тыс ₽ у дилера, обычно «Бинар»), клапан контура отопления меняют, бракованные 12В АКБ — тоже меняют. Дилерская сеть сжимается: всю переписку ведите письменно, чтобы была база для претензий."},"EVOL-02":{"t":"Evolute без подогрева батареи: зимой зарядка и разгон проблемные","s":"Подогрева батареи у Evolute i-PRO нет — зимой и заряд, и разгон идут тяжело. Выручают дизельный отопитель (аналог Вебасто), гараж и предпрогрев из приложения, если в вашей комплектации есть телематика. Для такси машина тяжёлая — считайте заранее."},"EVOL-03":{"t":"Moskvich 3e: зарядное 2,3 кВт без таймера, лючок обмерзает","s":"Штатное зарядное Moskvich 3e даёт 2,3 кВт без таймера: ставьте умную розетку или таймер на станции. Прогревочная подзарядка 30–40 минут перед выездом оттаивает лючок.","l":"zaryadka-ot-rozetki"},"AITO-01":{"t":"AITO M7: V2L есть, V2H/V2G в России не заявлены — как беречь батарею","s":"V2L (питание приборов от машины) у M7 есть, а обратную передачу в сеть (V2H/V2G) в РФ никто не заявлял. Живите по рекомендациям BMS: 20–80% в ежедневной езде и предпрогрев перед быстрой зарядкой зимой. Раз в 30 тыс км проверяйте HV-соединения, охлаждающую жидкость батареи меняйте на 80–100 тыс км."},"EX-01":{"t":"Exlantix ET/ES: две версии разъёмов — легко купить не тот зарядный","s":"У Exlantix два варианта разъёмов — Type 2/CCS2 и GB/T. Легко купить «не тот» зарядник: перед заказом сверяйте разъём по VIN или фото лючка. Точная раскладка по конкретной модели — в разделе «Модели»."},"MHE-01":{"t":"M-Hero 917: сбои гибридной системы и отказ зарядки — куда обращаться","s":"Сбои гибридной системы, ограничение мощности, перегрев батареи — обращайтесь письменно и фиксируйте повторность обращений: для претензий это критично. Обслуживайтесь в профильных сервисах по китайскому премиуму."}};

<script>
/* ---------- evTrack + переходы на сайт ---------- */
function evTrack(ev,val){
  try{const log=JSON.parse(localStorage.getItem('ev_events')||'[]');
  log.push({e:ev,v:val===undefined?null:val,t:Date.now()});
  localStorage.setItem('ev_events',JSON.stringify(log.slice(-100)));
  }catch(e){}
}
const SITE_CATALOG_URL='https://zapashoda-ev.ru/catalog/';
const SITE_TR={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',' ':'-','/':'-','.':'-','(':'',')':'',',':'','+':'','–':'-','—':'-'};
function slugRu(s){return s.toLowerCase().split('').map(function(c){return Object.prototype.hasOwnProperty.call(SITE_TR,c)?SITE_TR[c]:c}).join('').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');}
function modelSiteUrl(brand,model){return 'https://zapashoda-ev.ru/models/'+slugRu(brand)+'-'+slugRu(model)+'.html';}
function haptic(kind){try{const h=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback;if(h&&h.impactOccurred)h.impactOccurred(kind||'light');}catch(e){}}
function openChannel(){
  var url=(typeof CHANNEL_URL==='string')?CHANNEL_URL:'https://t.me/zapashoda_ev';
  var tg=window.Telegram&&Telegram.WebApp;
  if(tg&&tg.openTelegramLink){try{tg.openTelegramLink(url);return;}catch(e){}}
  if(tg&&tg.openLink){try{tg.openLink(url);return;}catch(e){}}
  if(typeof window.open==='function'){try{window.open(url,'_blank');return;}catch(e){}}
  try{location.href=url;}catch(e){}
}
function openSite(url){
  haptic('light'); const tg=window.Telegram&&Telegram.WebApp; if(tg&&tg.openLink){try{tg.openLink(url);}catch(e){if(typeof window.open==='function')window.open(url,'_blank');}} else if(typeof window.open==='function'){window.open(url,'_blank');} }
/* ---------- Таб-бар и навигация ---------- */
const TAB_OF={home:'home',model:'home',gloss:'gloss',cat:'cat',cart:'cart'};
function tabGo(v){
  haptic('light');
  showView(v);
}
const _sv=showView;
showView=function(v){
  _sv(v);
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===(TAB_OF[v]||'home')));
  try{const bb=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.BackButton;if(bb&&bb.show){if(v==='home')bb.hide();else bb.show();}}catch(e){}
};
function goBack(){ if(state.view==='model'||state.view==='gloss') showView('home'); }

/* init Telegram */
if(window.Telegram&&Telegram.WebApp){try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}}

setTimeout(function(){try{var h=document.getElementById('v-home');if(h&&!h.innerHTML.trim()){var __d='renderHome='+(typeof renderHome)+' \u00b7 MODELS='+(typeof MODELS!=='undefined'?MODELS.length:'нет')+' \u00b7 car='+String(localStorage.getItem('ev_my_car'))+' \u00b7 sub='+String(localStorage.getItem('ev_sub'));h.innerHTML='<div class="card">'+'<div style="font-weight:800;margin-bottom:6px">Апп не отрисовался</div>'+'<div style="font-size:12.5px;color:var(--muted);word-break:break-all">'+__d+'</div>'+'<button class="b-add" style="width:100%;padding:12px;margin-top:10px" onclick="try{localStorage.removeItem(\'ev_my_car\')}catch(e){} if(typeof renderHome===\'function\'){document.getElementById(\'v-home\').innerHTML=\'\';try{renderHome()}catch(e2){}}">Попробовать восстановить</button>'+'\n'+'<button class="b-light" style="width:100%;padding:12px;margin-top:8px" onclick="location.href=location.href">Перезагрузить</button>'+'<button class="b-light" style="width:100%;padding:12px;margin-top:8px" onclick="openSite(\'https://zapashoda-ev.ru/\')">Каталог и гайды \u2014 на сайте</button>';}}catch(e){}},3500);
try{const _tg=window.Telegram.WebApp;if(_tg.setHeaderColor)_tg.setHeaderColor('#0E1621');if(_tg.BackButton&&_tg.onEvent)_tg.onEvent('backButtonClicked',function(){goBack();haptic('soft');});}catch(e){}

</script>
